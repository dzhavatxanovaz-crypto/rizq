<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ильм-Крафт - RIZQ</title>
<style>
:root{--bg:#EDEEE1;--ink:#2A201C;--card:#fff;--gold:#7A6435;--gold2:#C3AD70;--btn:#2A201C;--btnink:#f6efdc;--edge:#2A201C;--line:#d9d6c3;--note:#5a4d42;--now:#f6f0de;--okc:#2f7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--ink:#f1ead7;--card:#2a201c;--gold:#C3AD70;--btn:#4a3a2e;--btnink:#f6efdc;--edge:#C3AD70;--line:#4a3d34;--note:#d6cab3;--now:#33281f;--okc:#7fd19b}}
:root[data-theme="dark"]{--bg:#1c1511;--ink:#f1ead7;--card:#2a201c;--gold:#C3AD70;--btn:#4a3a2e;--btnink:#f6efdc;--edge:#C3AD70;--line:#4a3d34;--note:#d6cab3;--now:#33281f;--okc:#7fd19b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Geologica,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:480px;margin:0 auto;padding:10px 16px 28px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#hud{display:flex;gap:6px;margin:2px 0 8px}
.st{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:3px 4px;text-align:center;font-weight:700;font-size:15px}
.st img{width:18px;height:18px;vertical-align:-3px;image-rendering:pixelated;margin-right:3px}
.st span{display:block;font-size:11px;font-weight:500;color:var(--note)}
.bar{height:5px;background:var(--line);margin-top:2px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold2);transition:width .5s}
.dl{position:absolute;right:4px;top:-4px;font-size:13px;font-weight:800;animation:dl 1.1s forwards;pointer-events:none}.dl.up{color:#2f7d4f}.dl.dn{color:#c0504d}
@keyframes dl{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.dl{animation:none;opacity:1}.bar i{transition:none}}
.pin{display:inline-block;width:72px;padding:8px;font-size:20px;border:2px solid var(--edge);border-radius:8px;background:var(--card);color:var(--ink);text-align:center}
.bar i.low{background:#c0504d}
#cvw{text-align:center}
canvas{display:inline-block;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--edge);border-radius:6px;background:#000;touch-action:manipulation}
#ttl{font-weight:700;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;font-size:13px;margin:10px 0 2px}
#txt{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0 10px;animation:f .25s}
#txt p{margin:0 0 8px}#txt>*:last-child{margin-bottom:0}
.who{display:block;font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.say{margin:0 0 10px}
.now{border-left:4px solid var(--gold2);background:var(--now);padding:8px 10px;margin:0 0 10px;border-radius:0 8px 8px 0}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#txt{animation:none}}
.btn{display:block;width:100%;text-align:left;background:var(--btn);color:var(--btnink);border:0;border-bottom:4px solid #000;border-radius:8px;padding:12px 14px;margin:7px 0;font:inherit;font-weight:600;cursor:pointer;min-height:48px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--edge);border-bottom-width:4px}
.btn.gold{background:var(--gold2);color:#2A201C}
.btn small{display:block;font-weight:400;opacity:.85;margin-top:2px}
.btn[disabled]{opacity:.45}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.row img{width:27px;height:27px;image-rendering:pixelated}
.row b{flex:1;font-weight:600}.row .q{min-width:22px;text-align:center;font-weight:700}
.sm{width:44px;height:44px;border-radius:8px;border:2px solid var(--edge);background:var(--card);color:var(--ink);font-size:22px;font-weight:700;flex:none}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pal button{flex:1;min-width:58px;padding:6px 2px;border:2px solid var(--edge);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:12px}
.pal button img{display:block;width:30px;height:30px;margin:0 auto 2px;image-rendering:pixelated}
.pal button.sel{background:var(--gold2);color:#2A201C}
.note{font-size:14px;color:var(--note)}
.ok{color:var(--okc);font-weight:600}
.arab{font-size:30px;direction:rtl;text-align:center;margin:4px 0;color:var(--gold);font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif}
.word{display:flex;align-items:center;gap:10px;border:2px dashed var(--gold2);border-radius:8px;padding:6px 10px;margin:6px 0}
.word .ar{font-size:24px;direction:rtl;color:var(--gold);font-family:"Amiri","Noto Naskh Arabic",serif;min-width:70px;text-align:center}
.cmp{display:flex;gap:8px;margin:6px 0}.cmp div{flex:1;border:2px solid var(--line);border-radius:8px;padding:8px;font-size:14px;text-align:center}
.cmp b{display:block;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold2);color:#2A201C;font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9;max-width:90%;text-align:center;animation:f .25s}
pre{white-space:pre-wrap;font-size:12px;background:var(--now);padding:8px;border-radius:8px;max-height:300px;overflow:auto}
@media (max-height:740px){#hud{margin-bottom:4px}#txt{padding:10px 12px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="cvw"><canvas id="cv" width="320" height="180" role="img" aria-label="Картинка сцены"></canvas></div>
  <div id="ttl"></div>
  <div id="txt"></div>
  <div id="btns"></div>
</div>
<script>
(function(){
/* =========================================================
   Ильм-Крафт. Глава 1 «Честный торговец». RIZQ, 2026.
   ES5, один файл, без библиотек. Данные - только на телефоне.
   Тексты для озвучки (Marina) - в SCRIPT, ключи по сценам.
   ========================================================= */
var W=320,H=180,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var $=function(i){return document.getElementById(i)};
var KEY='rizq_igra_v1',LIM=1200;
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S=null,bg='mecca',cast=[],T=0,lim=false,scl=null,playing=false,camelOn=false;

/* ---------- сценарий (для озвучки Marina) ---------- */
/* {ж|м} - форма для девочки и мальчика, $1 $2 - подстановки */
var SCRIPT={
'title.1':'Ты впервые идёшь с караваном из Мекки в Шам. Купи товар, переживи дорогу, сохрани доверие людей - и построй свой город.',
'title.2':'В игре нет изображений Пророка (саллаллаху алейхи ва саллям) и сподвижников. О них мы рассказываем словами и только то, что передано в достоверных источниках.',
'intro.now':'Мекка, за несколько лет до начала откровения. Тебе 13 лет. Караван идёт в Шам. <span class="note">Шам - так тогда называли земли нынешних Сирии, Иордании, Палестины и Ливана.</span>',
'intro.1':'Я иду с вами и присматриваю за тобой. Вот 100 монет. Купи то, что в Шаме дороже. Твой верблюд унесёт 6 тюков.',
'intro.2':'Вернёшься с прибылью - доверю тебе свой тюк в следующем караване.',
'elder.0':'Старый купец чинит ремень седла и поднимает глаза.',
'elder.1':'Знаешь, кого в Мекке зовут аль-Амин? Того, кому можно доверить. Он не лжёт и не обманывает.',
'elder.2':'Почтенная Хадиджа узнала о его правдивости и честности и доверила ему свой товар для торговли в Шаме. Торговля - это не только цена. Это слово, которому верят.',
'elder.now':'Аль-Амин - это Мухаммад (саллаллаху алейхи ва саллям), будущий Пророк. Так его звали в его народе ещё до пророчества (сира Ибн Хишама). Даже Абу Суфьян, в то время ещё его противник (позже он принял ислам), признал перед царём Ираклием, что его ни разу не обвиняли во лжи (аль-Бухари 7).',
'elder.a':'Хорошее желание. Начни с малого: держи слово даже в мелочах. И вот совет: в Шаме в этом году хорошо берут $1.',
'elder.b':'Выгодна. Сегодня, завтра - может, и нет. А через год - только она. Ты {сама|сам} увидишь в пути. А пока совет: в Шаме в этом году хорошо берут $1.',
'road.1':'Караван выходит из Мекки на рассвете. Верблюды идут ровно, песок скрипит. Дядя Салим едет впереди.',
'str.1':'В полдень у дороги сидит путник в зелёном платке с жёлтой каймой. Бурдюк у него пустой. Он просит воды.',
'str.give':'Он пьёт, благодарит и уходит к соседнему каравану. Ты {запомнила|запомнил} его платок.',
'str.no':'Ты идёшь дальше. Путник смотрит вслед и ничего не говорит.',
'storm.1':'Ветер несёт песок стеной. Песок сечёт ткань и забивается во все тюки. Благовониям в закрытых флаконах буря не страшна.',
'storm.wait':'Караван встаёт кругом, ты накрываешь тюки. Буря уходит только к вечеру. Товар цел, но воды ушло много.',
'storm.lost':'Песок изрезал один рулон ткани - его уже не продать.',
'storm.ok':'Тебе повезло: товар уцелел.',
'camp.1':'Вечер. Погонщики смывают пыль, дядя Салим проверяет верёвки. Ужин у костра делят на всех.',
'wudu.now1':'Откровение ещё не началось, и намаза, которому научит Пророк (саллаллаху алейхи ва саллям), люди ещё не знали. Пройдут годы, и Аллах научит верующих омовению и молитве.',
'wudu.now2':'А ты знаешь обязательные действия омовения? Собери их по порядку.',
'wudu.done':'По шафиитскому мазхабу обязательно (фард): намерение вместе с началом омовения лица, лицо, руки вместе с локтями, протереть хотя бы часть головы, ноги вместе со щиколотками - и именно в этом порядке. Желательно (сунна): в начале сказать «Бисмиллях», вымыть кисти, прополоскать рот и промыть нос, а после головы протереть уши. В других мазхабах есть отличия - спроси у имама.',
'oasis.1':'Оазис. Пальмы, колодец, торговцы водой. Караван отдыхает до полудня.',
'oasis.low':'Воды мало. Без воды караван пойдёт медленнее, и ты устанешь.',
'def.1':'У колодца к тебе подходит покупатель. Он хочет купить $1 и готов заплатить сразу полную цену - $2.',
'def.dates':'В одном мешке фиников сверху хорошие, а внутри - с червоточиной.',
'def.cloth':'На одном рулоне ткани есть дырочка от моли. Снаружи её не видно.',
'def.oil':'Один флакон благовоний треснул, в нём осталась половина. Покупатель этого не заметил.',
'def.honest':'Ты {первая|первый}, кто сказал сам. В следующий раз беру только у тебя.',
'def.ask':'Честному - честная цена. Возьму, но дам чуть меньше. И запомню тебя.',
'def.hide1':'Он платит и уходит. Монеты в руке, а на душе неспокойно.',
'def.hide2':'Скоро в караване шепчутся: «Это {у неё|у него} товар с изъяном?»',
'def.now':'Однажды Пророк (саллаллаху алейхи ва саллям) проходил мимо кучи зерна и опустил в неё руку. Пальцы стали влажными. Хозяин сказал: «Её намочил дождь». Пророк (саллаллаху алейхи ва саллям) ответил: «Почему же ты не положил подмокшее сверху, чтобы люди видели? Кто обманывает, тот не от меня» (Муслим 102, перевод смысла). Учёные объясняют: «не от меня» значит «не идёт моим путём», а не «перестал быть мусульманином» (ан-Навави).',
'sham.1':'Шам. Огромный рынок - по-арабски сук. Здесь торгуют купцы со всего света.',
'sham.tired':'Ты очень {устала|устал}: торговаться будет трудно (-10% к цене).',
'sham.str':'Это ты {дала|дал} мне воды! Слушай: вон тот купец в красном платит фальшивыми монетами. Не продавай ему.',
'sham.strnow':'Ты не {знала|знал}, что он вернётся. Добро делают не ради ответа, а Аллах даёт ризк и оттуда, откуда не ждёшь.',
'sham.nostr':'В толпе мелькает знакомый зелёный платок. Путник смотрит на тебя и проходит мимо.',
'sham.conf':'У ряда с тканями ты видишь покупателя из оазиса.',
'sham.confnow':'Если обидел человека - верни его право и попроси прощения. Так исправляют ошибку.',
'sham.confok':'Он долго молчит, потом кивает: «Не каждый возвращается. Мир тебе».',
'wei.1':'Помоги, дитя! Отвесь покупательнице пять мер перца. Заплачу тебе 5 монет за работу. Захочешь - добавь щепотку сверху, я разрешаю.',
'wei.even':'Мера полная. Аллах говорит: «Наполняйте меру сполна, когда вы отпускаете мерой, и взвешивайте на точных весах» (Коран 17:35).',
'wei.more':'Покупательница улыбается и зовёт подругу: «У этого ряда не обвешивают». Слух о честных весах идёт по рынку.',
'wei.morenow':'Пророк (саллаллаху алейхи ва саллям) сказал человеку, который взвешивал за плату: «Взвешивай и добавляй» (ат-Тирмизи 1305, Абу Дауд 3336, перевод смысла). Добавлять можно своё или с разрешения хозяина товара.',
'wei.less':'Покупательница перевешивает на своих весах и уходит. Торговец остался без покупки, а ты - без платы.',
'wei.lessnow':'Аллах говорит: «Горе обвешивающим, которые требуют дать им сполна, когда люди отмеривают им, а когда сами мерят или взвешивают для других, то наносят им урон» (Коран 83:1-3).',
'oath.1':'Поклянись, что лучше $1 нет во всём Шаме - тогда возьму дороже.',
'oath.no':'Покупатель сам смотрит товар, кивает и платит обычную цену.',
'oath.yes':'Покупатель платит дороже. А вечером в соседнем ряду он видит товар не хуже и говорит соседям: «Этот купец клянётся легко». Монеты звенят, но радости нет.',
'oath.now':'Пророк (саллаллаху алейхи ва саллям) сказал: «Клятва помогает продать товар, но лишает его благодати» (аль-Бухари 2087; у Муслима 1606 - «...но лишает прибыли»; перевод смысла).',
'sell.fake':'Купец в красном расплатился фальшивыми монетами: пропало $1.',
'wid.1':'У выхода с рынка сидит вдова с детьми и продаёт лепёшки.',
'wid.now':'Аллах говорит: «Притчей о тех, кто расходует свое имущество на пути Аллаха, является притча о зерне, из которого выросло семь колосьев, и в каждом колосе - по сто зерен» (Коран 2:261). А Пророк (саллаллаху алейхи ва саллям) сказал: «Садака не уменьшает имущества» (Муслим 2588, перевод смысла). Садака - любая сумма.',
'wid.thanks':'Вдова тихо благодарит. Её младший сын машет тебе вслед.',
'unc.good':'Люди на рынке говорили о тебе хорошо. Это дороже любой прибыли. В следующий караван возьмёшь мой тюк.',
'unc.mid':'Хорошее начало. В следующий караван доверю тебе свой тюк.',
'unc.low':'Монеты ты {привезла|привёз}. Но доверие людей вернуть труднее, чем заработать монету. Подумай об этом до следующего каравана.',
'name.1':'Ар-Раззак - Наделяющий уделом, Дающий пропитание. Тот, Кто даёт каждому его удел: и то, что мы видим, и то, чего не ждём.',
'name.2':'Аллах говорит: «Воистину, Аллах является Наделяющим уделом, Обладающим могуществом, Крепким» (Коран 51:58).',
'name.now':'Помнишь зелёный платок? «Тому, кто боится Аллаха, Он создает выход из положения и наделяет его уделом оттуда, откуда он даже не предполагает» (Коран 65:2-3).',
'name.bar':'Монеты бывают в руке, а барака - нет. Барака - это благословение, которое даёт Аллах.',
'end.hook':'Утром у твоего тюка лежит свёрток с жёлтой каймой. Внутри - табличка с незнакомыми знаками. Кто его оставил?',
'end.next':'Глава 2 - «Ночь в пещере Хира».',
'riba.1':'У ворот рынка ростовщик звенит монетами: «Дам тебе 20 монет сейчас, а в Шаме вернёшь 30. Купишь больше товара!»',
'riba.unc':'Подумай: 10 монет сверху - это твоя прибыль, которую ты отдашь ему. А если товар пропадёт в пути?',
'riba.now':'Позже в Коране будет сказано: «Аллах дозволил торговлю и запретил лихоимство» (Коран 2:275). Лихоимство (риба) в долге - это когда заранее ставят условие вернуть больше, чем взяли.',
'riba.pay':'Ростовщик уже ждёт тебя в Шаме. Ты {отдала|отдал} ему 30 монет.',
'ev.purse.1':'У дороги в песке лежит кожаный кошелёк. Внутри монеты. Вокруг никого.',
'ev.purse.ask':'Кошелёк ищет пожилая женщина из соседнего каравана. Она плачет от радости: «Это всё, что у меня было на дорогу».',
'ev.purse.unc':'Дядя Салим громко объявляет о находке. Скоро хозяйка находится. Дядя кивает тебе: «Правильно, что не {оставила|оставил} себе».',
'ev.purse.keep':'Монеты звенят в кармане. Чуть позже пожилая женщина из соседнего каравана спрашивает всех, не видел ли кто её кошелёк.',
'ev.purse.now':'Найденная вещь - чужая амана. Пророк (саллаллаху алейхи ва саллям) велел объявлять о находке, чтобы вернуть её хозяину (аль-Бухари 2372, Муслим 1722, перевод смысла). Сколько объявлять и как быть, если хозяин не нашёлся, - спроси у имама.',

function hud(show){
  var h=$('hud');
  if(!show||!S){h.style.display='none';prevH=null;return}
  h.style.display='';
  var cur={w:Math.round(S.water),e:Math.round(S.energy),t:Math.round(S.trust),m:S.money},pv=prevH||cur,ws=[];
  function dl(k){var d=cur[k]-pv[k];return d?'<b class="dl '+(d>0?'up':'dn')+'">'+(d>0?'+':'')+d+'</b>':''}
  function one(k,ic,lab){var v=clamp(cur[k],0,100),p0=clamp(pv[k],0,100);ws.push(v);return '<div class="st">'+dl(k)+'<img alt="" src="'+IC[ic]+'">'+cur[k]+'<div class="bar"><i class="'+(v<30?'low':'')+'" style="width:'+p0+'%"></i></div><span>'+lab+'</span></div>'}
  h.innerHTML=one('w','water','вода')+one('e','energy','силы')+one('t','trust','доверие')+'<div class="st">'+dl('m')+'<img alt="" src="'+IC.coin+'">'+cur.m+'<span>монеты</span></div>';
  setTimeout(function(){var bs=h.querySelectorAll('.bar i');for(var i=0;i<bs.length;i++)bs[i].style.width=ws[i]+'%'},30);
  if(prevH&&cur.m>pv.m)sfx('coin');
  prevH=cur;
}
function say(o){
  bg=o.bg||bg;cast=o.cast||[];camelOn=!!o.camel;
  hud(!o.nohud);
  var same=o.stay&&$('ttl').textContent===(o.t||'');
  $('ttl').textContent=o.t||'';
  var c=$('txt');if(!same){var tx=c;c=tx.cloneNode(false);tx.parentNode.replaceChild(c,tx);c.id='txt'}
  var h='';
  (o.p||[]).forEach(function(x){
    if(!x)return;
    if(typeof x==='string')h+='<p>'+x+'</p>';
    else if(x.now)h+='<div class="now"><span class="who">Рассказчица</span>'+x.now+'</div>';
    else if(x.w)h+='<div class="say"><span class="who">'+x.w+'</span>«'+x.t+'»</div>';
    else if(x.html)h+=x.html;
  });
  c.innerHTML=h;
  var b=$('btns');b.innerHTML='';
  (o.b||[]).forEach(function(x){
    if(!x)return;
    var e=document.createElement('button');e.className='btn '+(x.c||'');
    e.innerHTML=x.t+(x.s?'<small>'+x.s+'</small>':'');
    if(x.d)e.disabled=true;
    e.onclick=function(ev){sfx('tap');vib(8);x.f(ev)};b.appendChild(e);
  });
  if(o.extra)o.extra(b);
  cv.setAttribute('aria-label',o.alt||o.t||'Картинка сцены');
  if(!same)window.scrollTo(0,0);
}

  say({t:'Рынок Мекки',bg:'mecca',stay:true,camel:true,cast:[['hero',120,96]],p:[
    'Верблюд: <b>'+mqn()+' из 6</b> тюков. Потратишь <b>'+mcost()+'</b> из '+S.money+'.',
    '<span class="note">Совет старика: в Шаме хорошо берут '+gname(S.hint)+'.</span>',
    msg?'<span class="note"><b>'+msg+'</b></span>':''
  ],extra:function(b){
    KEYS.forEach(function(k){
      var r=document.createElement('div');r.className='row';
      r.innerHTML='<img alt="" src="'+IC[k]+'"><b>'+GOODS[k].n+' - '+GOODS[k].buy+'<br><span class="note">'+GOODS[k].d+'</span></b>';
      var m=document.createElement('button');m.className='sm';m.textContent='-';m.setAttribute('aria-label','Убрать: '+GOODS[k].n);
      var q=document.createElement('span');q.className='q';q.textContent=mq[k];
      var p=document.createElement('button');p.className='sm';p.textContent='+';p.setAttribute('aria-label','Добавить: '+GOODS[k].n);
      m.onclick=function(){if(mq[k]>0){mq[k]--;renderMarket()}};
      p.onclick=function(){
        if(mqn()>=6)return renderMarket('Верблюд полон: 6 тюков.');
        if(mcost()+GOODS[k].buy>S.money)return renderMarket('Не хватает монет.');
        mq[k]++;renderMarket();
      };
      r.appendChild(m);r.appendChild(q);r.appendChild(p);b.appendChild(r);
    });
    var bt=document.createElement('button');bt.className='btn gold';
    bt.textContent=mqn()<2?'Возьми хотя бы 2 тюка':'Купить и идти к каравану';
    if(mqn()<2)bt.disabled=true;
    bt.onclick=function(){
      KEYS.forEach(function(k){S.inv[k]=mq[k]});S.money-=mcost();S.start=100;
      stat('pokupka','финики '+mq.dates+', ткань '+mq.cloth+', благовония '+mq.oil);go('road');
    };
    b.appendChild(bt);
  }});
}

function pct(){return Math.round((S.trust-50)/2)+S.bonus-(S.energy<30?10:0)}
function priceOf(k){return Math.round(GOODS[k].sell*S.mk[k]*(1+pct()/100))}
SC.sell=function(){
  if(S.debt&&!S.debtPaid){
    var kk=null;KEYS.forEach(function(k){if(S.inv[k]>0&&(!kk||priceOf(k)>priceOf(kk)))kk=k});
    var paid=0,tk='';
    if(kk&&S.money<S.debt){var p70=Math.round(priceOf(kk)*0.7);S.inv[kk]--;paid=Math.min(S.debt,p70);tk=' Он забирает тюк ('+gname(kk)+') всего за '+mon(p70)+(p70>S.debt?' и сдачи не даёт.':'.')}
    var rest=S.debt-paid;S.money-=rest;S.debt=0;S.debtPaid=true;
    return say({t:'Ростовщик',bg:'sham',cast:[['hero',120,108],['changer',176,108]],p:['У ворот Шама тебя ждёт ростовщик.',{w:'Ростовщик',t:tk?'Долг - 30 монет. Монет не хватает? Тогда беру тюк - по моей цене.':'Долг - 30 монет. Плати.'},(tk?tk.trim()+' ':'')+(rest>0?'Ты '+g('отдала','отдал')+(tk?' ещё ':' ')+mon(rest)+'.':'')],b:nx('На рынок',function(){go('sell')})});
  }
  var total=0,lines=[];

function lifeOf(id){if(id==='razzaq'&&!(S&&S.helped))return 'Ризк приходит и оттуда, откуда не ждёшь: «...и наделяет его уделом оттуда, откуда он даже не предполагает» (65:3). Трудись честно, а удела проси у Него.';return Lx(GEMS[id].life)}
function meanQuiz(id,done){
  var g0=GEMS[id],o=shuf([g0.mean].concat(shuf(DIST.filter(function(x){return x!==g0.mean})).slice(0,2)));
  say({t:'Грань: проверь себя',bg:'gem',nohud:true,cast:[],p:['Что значит имя Аллаха <b>'+g0.n+'</b>?'],b:o.map(function(x){return {t:x,c:'alt',f:function(){var ok=x===g0.mean;sfx(ok?'facet':'wrong');vib(ok?[20,30,20]:30);done(ok)}}})});
}
function polish(id,back){
  var gm=gems()[id],g0=GEMS[id];gemNow={id:id,lit:2};
  meanQuiz(id,function(ok){
    var t=dn(),nx2=gm.f<3?3:(gm.b>=1?7:3);
    if(ok){gm.f=3;gm.b=(gm.b||0)+1;gm.r=t+nx2}else{gm.r=t+1}
    setGem(id,gm);gemNow={id:id,lit:ok?3:2};stat('ogranka',g0.n+(ok?' - сияет':' - повторить завтра'));
    say({t:ok?g0.n+': самоцвет сияет!':'Почти!',bg:'gem',nohud:true,cast:[],p:[ok?'<span class="ok">Верно!</span> Блеск: '+'✧'.repeat(Math.min(5,gm.b)):'Правильно: <b>'+g0.mean+'</b>. Вспомним ещё раз завтра.',g0.ayah],b:nx('Дальше',back)});
  });
}
function gemIcon(id,z){var p=GEMS[id].pal;return iconURL(GEM,p,z||3)}
function drawGem(){
  px(0,0,W,H,'#120d1f');
  for(var i=0;i<30;i++){var sx=(i*67+T*(RM?0:1))%W,sy=(i*41)%H;if(((T>>3)+i)%5)px(sx,sy,1,1,'#5a4a8a')}
  if(!gemNow)return;
  var g0=GEMS[gemNow.id],p=g0.pal,lit=gemNow.lit,z=8,x0=(W-13*z)/2,y0=(H-11*z)/2;
  var dim={a:'#2a2238',b:'#3a3050',c:'#4a4064',d:'#332a48'};
  for(var j=0;j<GEM.length;j++)for(var k=0;k<13;k++){var ch=GEM[j].charAt(k);if(ch==='.')continue;
    var on=lit>=3||(lit>=1&&j<4)||(lit>=2&&j>=4)||ch==='a'&&lit>=1;
    px(x0+k*z,y0+j*z,z,z,on?p[ch]:dim[ch])}
  if(lit>=3&&!RM)for(var q=0;q<6;q++){var a=(T*0.08+q*1.05),r=70+(q%2)*8,sx2=160+Math.cos(a)*r,sy2=90+Math.sin(a)*r*0.6;px(sx2-3,sy2,7,1,'#fff6c8');px(sx2,sy2-3,1,7,'#fff6c8')}
}
function playIdx(i){
  var n=('0'+i).slice(-2),a=new Audio('../audio/names/'+n+'.mp3');
  a.onerror=function(){var b=new Audio('audio/'+n+'.mp3');var q=b.play();if(q&&q.catch)q.catch(function(){})};
  var p=a.play();if(p&&p.catch)p.catch(function(){});
}
function gemShow(id,done){
  var g0=GEMS[id],first=!Object.keys(gems()).length,have=gems()[id];
  if(have){gemNow={id:id,lit:have.f>=3?3:2};
    return say({t:'Знакомый самоцвет',bg:'gem',nohud:true,cast:[],p:['<div class="arab">'+g0.ar+'</div>','Имя Аллаха <b>'+g0.n+'</b> уже в твоей Сокровищнице. Вспомни его - и самоцвет заблестит ярче.'],b:[{t:'Вспомнить',f:function(){polish(id,done)}},{t:'Дальше',c:'alt',f:done}]});}
  gemNow={id:id,lit:1};sfx('facet');vib([20,30,20]);
  var snd={t:'▶ Послушать имя',c:'alt',f:function(){playIdx(g0.i)}};
  say({t:L('gem.found'),bg:'gem',nohud:true,cast:[],p:['<div class="arab">'+g0.ar+'</div>','Это одно из прекрасных имён Аллаха: <b>'+g0.n+'</b> - '+g0.mean+'.','<span class="note">Самоцвет - образ знания об имени, которое ты хранишь в сердце. Первая грань загорелась, вторую зажжёт ответ.</span>'],b:[snd,{t:'Вторая грань: проверь себя ✦',f:function(){
    meanQuiz(id,function(ok){
      gemNow.lit=2;
      say({t:g0.n+': аят',bg:'gem',nohud:true,cast:[],p:[ok?'<span class="ok">Верно!</span> Вторая грань горит.':'Правильно: <b>'+g0.mean+'</b>. Вторая грань всё равно горит - знание пришло.',g0.ayah],b:[{t:'Как жить с этим именем',f:function(){
        say({t:g0.n+': как жить с этим именем',bg:'gem',nohud:true,cast:[],p:[lifeOf(id),'<span class="note">Третья грань засияет завтра: вернись и вспомни имя.</span>'],b:[{t:'Положить в Сокровищницу',c:'gold',f:function(){
          setGem(id,{d:day(),f:2,r:dn()+1,b:0});stat('samocvet',g0.n);var gq=gems();if(gq.raqib&&gq.karim)badge('sled');
          if(first)seq([{t:'Сокровищница имён',bg:'gem',nohud:true,cast:[],p:[{now:L('gem.intro')}]},{t:'Сокровищница имён',bg:'gem',nohud:true,cast:[],p:[{now:L('gem.intro2')}],b:nx('Открыть Сокровищницу',function(){treasury(done,id)})}]);
          else treasury(done,id);
        }}]});
      }}]});
    });
  }}]});
}
var CH1=['razzaq','raqib','karim'],HINT={razzaq:'в конце пути',raqib:'ищи ночью на привале (✦)',karim:'смотри вокруг на рынке Шама (✦)'};
function treasury(back,focus){
  var gg=gems(),ids=Object.keys(GEMS),have=ids.filter(function(k){return gg[k]}),n=have.length;
  gemNow=focus?{id:focus,lit:gg[focus]&&gg[focus].f>=3?3:2}:(n?{id:have[have.length-1],lit:3}:null);
  var cells='';var byIdx={};ids.forEach(function(k){byIdx[GEMS[k].i]=k});
  for(var i=0;i<=98;i++){var k=byIdx[i];cells+=k&&gg[k]?'<img alt="" src="'+gemIcon(k,2)+'" style="width:26px;height:22px;image-rendering:pixelated">':'<span aria-hidden="true" style="display:inline-block;width:26px;height:22px;text-align:center;color:var(--note);opacity:.45;font-size:12px">◇</span>'}
  var line='Глава 1: '+CH1.map(function(k){return gg[k]?'◆':'◇'}).join(''),miss=CH1.filter(function(k){return !gg[k]});
  say({t:'Сокровищница имён',bg:'gem',nohud:true,cast:[],p:[
    'Собрано <b>'+n+' из 99</b>. '+line+(miss.length?'<br><span class="note">Не хватает: '+miss.map(function(k){return HINT[k]}).join('; ')+'.</span>':' <span class="ok">Глава собрана!</span>'),
    {html:'<div role="img" aria-label="Собрано '+n+' самоцветов из 99" style="display:flex;flex-wrap:wrap;gap:2px;margin:6px 0 10px">'+cells+'</div>'},
    (function(){var bd=load().badges||{},ks=Object.keys(BADGES);return '<b>Знаки следопыта: '+ks.filter(function(k){return bd[k]}).length+' из '+ks.length+'</b><br><span class="note">'+ks.map(function(k){return (bd[k]?'◆ ':'◇ ')+BADGES[k]}).join('<br>')+'</span>'})(),
    '<span class="note">Привычный перечень 99 имён - из сборника ат-Тирмизи; имена в игре мы даём вместе с аятом Корана, где это имя упомянуто.</span>'
  ],extra:function(b){
    have.forEach(function(k){var g0=GEMS[k],gm=gg[k],e=document.createElement('button');e.className='btn alt';
      e.innerHTML='<img alt="" src="'+gemIcon(k,2)+'" style="width:26px;height:22px;vertical-align:-5px;image-rendering:pixelated;margin-right:8px"><b>'+g0.n+'</b> - '+g0.mean+'<small>огранка '+(gm.f>=3?'3/3':'2/3')+(gm.b?' · блеск '+'✧'.repeat(Math.min(5,gm.b)):'')+'</small>';
      e.onclick=function(){gemNow={id:k,lit:gm.f>=3?3:2};say({t:g0.n,bg:'gem',nohud:true,cast:[],p:['<div class="arab">'+g0.ar+'</div>',g0.ayah,lifeOf(k)],b:[{t:'▶ Послушать имя',c:'alt',f:function(){playIdx(g0.i)}},{t:'Назад в Сокровищницу',f:function(){treasury(back)}}]})};
      b.appendChild(e)});
    var e=document.createElement('button');e.className='btn';e.textContent=back?'Дальше':'На главный экран';e.onclick=function(){(back||title)()};b.appendChild(e);
  }});
}

/* ---------- мини-игра «Финики с пальмы» ---------- */
var cg=null;
function catchStart(){
  S.catchTry=(S.catchTry||0)+1;S.caught=true;
  cg={t:Date.now()+3000,items:[],bx:160,score:0,last:0,over:false};
  var arrows=function(b){
    var r=document.createElement('div');r.style.cssText='display:flex;gap:8px';
    ['◀','▶'].forEach(function(a,i){var e=document.createElement('button');e.className='btn alt';e.style.textAlign='center';e.textContent=a;e.setAttribute('aria-label',i?'Вправо':'Влево');
      e.onclick=function(){cg.bx=clamp(cg.bx+(i?44:-44),16,W-16)};r.appendChild(e)});b.appendChild(r)};
  say({t:'Финики с пальмы',bg:'catch',cast:[],p:[L('catch.1'),'Поймано: <b id="cgs">0</b>'],extra:arrows});
  function mv(e){if(bg!=='catch'||!cg)return;var r=cv.getBoundingClientRect();cg.bx=clamp((e.clientX-r.left)/r.width*W,16,W-16)}
  cv.onpointermove=mv;cv.onpointerdown=mv;
  var my=cg;setTimeout(function(){if(cg===my&&!my.over){my.over=true;catchEnd()}},18400);
}
function drawCatch(){
  px(0,0,W,60,'#bfe3f5');px(0,60,W,40,'#e3efd6');px(0,100,W,80,'#dcc58e');
  for(var p=0;p<4;p++){var x=30+p*85;px(x,16,5,140,'#7a5230');px(x-16,12,36,6,'#2f8f46');px(x-10,6,24,6,'#3aa856')}
  px(0,160,W,20,'#cdb27a');
  if(!cg)return;
  var now=Date.now(),left=Math.max(0,15000-Math.max(0,now-cg.t));
  if(now<cg.t){var cd=Math.ceil((cg.t-now)/1000);ctx.fillStyle='#2A201C';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText(String(cd),160,105);px(cg.bx-16,150,32,10,'#a07a3e');return}
  if(!cg.over){
    if(now-cg.last>520){cg.last=now;cg.items.push({x:20+Math.random()*280,y:20,v:3+Math.random()*3,g:Math.random()<0.1})}
    for(var i=cg.items.length-1;i>=0;i--){var it=cg.items[i];it.y+=it.v;
      if(it.y>=146&&it.y<=160&&Math.abs(it.x-cg.bx)<18){cg.items.splice(i,1);cg.score+=it.g?3:1;sfx('pop');vib(it.g?[15,20,15]:10);var el=document.getElementById('cgs');if(el)el.textContent=cg.score;continue}
      if(it.y>180)cg.items.splice(i,1)}
    if(left<=0){cg.over=true;var my=cg;setTimeout(function(){if(cg===my)catchEnd()},300)}
  }
  for(var j=0;j<cg.items.length;j++){var gi=cg.items[j];px(gi.x-3,gi.y,6,8,gi.g?'#e3c34a':'#7a3e1a');px(gi.x-1,gi.y-2,2,2,'#2f8f46');if(gi.g&&!RM&&(T>>2)%2)px(gi.x+4,gi.y-3,2,2,'#fff6c8')}
  px(cg.bx-16,150,32,10,'#a07a3e');px(cg.bx-16,150,32,2,'#c9a063');px(cg.bx-14,160,28,2,'#6b4a22');
  px(8,6,Math.round(left/15000*100),4,'#e3c34a');
}
function catchEnd(){
  if(!cg||cg.ended)return;cg.ended=true;
  cv.onpointermove=null;cv.onpointerdown=null;
  var sc=cg.score,plus=Math.min(30,sc*2);S.energy=clamp(S.energy+plus,0,100);if(sc>=5||S.catchTry>=2)S.catchTry=2;stat('finiki',sc);if(sc>=12)badge('ruki');
  say({t:'Финики с пальмы',bg:'oasis',cast:[['hero',150,104]],p:[sc?'Ты '+g('собрала','собрал')+' '+pl(sc,'финик','финика','фиников')+': +'+plus+' сил. Погонщики угощаются вместе с тобой.':'Финики упали в песок - бывает. Пальма ещё не опустела.'],b:nx('Дальше',function(){go('oasis')})});
}

      {t:'Спросить погонщика',f:function(){stat('mirazh','спросил(а)');end(L('ev.mir.ask'))}},
      {t:'Держаться каравана',c:'alt',f:function(){stat('mirazh','с караваном');end(L('ev.mir.stay'))}}]})},

      {t:'Купить мазь у погонщика',s:'-6 монет',d:S.money<6,f:function(){S.money-=6;stat('verblyud','мазь');end(L('ev.lame.salve'))}},
      {t:'Нести один тюк '+g('самой','самому'),s:'-20 сил',f:function(){S.energy=clamp(S.energy-20,0,100);stat('verblyud','несл(а) сам(а)');end(L('ev.lame.carry'))}},
      {t:'Попросить дядю взять тюк',c:'alt',f:function(){S.uncleOwes=1;stat('verblyud','дядя');end(L('ev.lame.uncle'))}}]})}
};
SC.ev1=function(){EVENTS[S.ev[0]](function(){go('camp')})};

mkIcons();fit();title();loop();
})();
