<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Ильм-Крафт - RIZQ</title>
<style>
:root{--bg:#EDEEE1;--ink:#2A201C;--card:#fff;--gold:#7A6435;--gold2:#C3AD70;--btn:#2A201C;--btnink:#f6efdc;--edge:#2A201C;--line:#d9d6c3;--note:#5a4d42;--now:#f6f0de;--okc:#2f7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--ink:#f1ead7;--card:#2a201c;--gold:#C3AD70;--btn:#4a3a2e;--btnink:#f6efdc;--edge:#C3AD70;--line:#4a3d34;--note:#d6cab3;--now:#33281f;--okc:#7fd19b}}
:root[data-theme="dark"]{--bg:#1c1511;--ink:#f1ead7;--card:#2a201c;--gold:#C3AD70;--btn:#4a3a2e;--btnink:#f6efdc;--edge:#C3AD70;--line:#4a3d34;--note:#d6cab3;--now:#33281f;--okc:#7fd19b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,canvas,#btns,#nav{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Geologica,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:480px;margin:0 auto;padding:10px 16px 28px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#nav{display:flex;gap:6px;margin:0 0 8px}#nav button{flex:1;min-height:44px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:13px;font-weight:600;padding:4px 6px}#nav button[disabled]{opacity:.4}
#hud{display:flex;gap:6px;margin:2px 0 8px}
.st{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:3px 4px;text-align:center;font-weight:700;font-size:15px}
.st img{width:18px;height:18px;vertical-align:-3px;image-rendering:pixelated;margin-right:3px}
.st span{display:block;font-size:11px;font-weight:500;color:var(--note)}
.bar{height:5px;background:var(--line);margin-top:2px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold2);transition:width .5s}
.dl{position:absolute;right:4px;top:-4px;font-size:13px;font-weight:800;animation:dl 1.1s forwards;pointer-events:none}.dl.up{color:#2f7d4f}.dl.dn{color:#c0504d}
@keyframes dl{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.dl{animation:none;opacity:1}.bar i{transition:none}}
.pin{display:inline-block;width:72px;padding:8px;font-size:20px;border:2px solid var(--edge);border-radius:8px;background:var(--card);color:var(--ink);text-align:center}
.bar i.low{background:#c0504d}
#cvw{text-align:center}
canvas{display:inline-block;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--edge);border-radius:6px;background:#000;touch-action:manipulation}
#ttl{font-weight:700;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;font-size:13px;margin:10px 0 2px}
#txt{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0 10px;animation:f .25s}
#txt p{margin:0 0 8px}#txt>*:last-child{margin-bottom:0}
.who{display:block;font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.say{margin:0 0 10px}
.now{border-left:4px solid var(--gold2);background:var(--now);padding:8px 10px;margin:0 0 10px;border-radius:0 8px 8px 0}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#txt{animation:none}}
.btn{display:block;width:100%;text-align:left;background:var(--btn);color:var(--btnink);border:0;border-bottom:4px solid #000;border-radius:8px;padding:12px 14px;margin:7px 0;font:inherit;font-weight:600;cursor:pointer;min-height:48px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--edge);border-bottom-width:4px}
.btn.gold{background:var(--gold2);color:#2A201C}
.btn small{display:block;font-weight:400;opacity:.85;margin-top:2px}
.btn[disabled]{opacity:.45}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.row img{width:27px;height:27px;image-rendering:pixelated}
.row b{flex:1;font-weight:600}.row .q{min-width:22px;text-align:center;font-weight:700}
.sm{width:44px;height:44px;border-radius:8px;border:2px solid var(--edge);background:var(--card);color:var(--ink);font-size:22px;font-weight:700;flex:none}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pal button{flex:1;min-width:58px;padding:6px 2px;border:2px solid var(--edge);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:12px}
.pal button img{display:block;width:30px;height:30px;margin:0 auto 2px;image-rendering:pixelated}
.pal button.sel{background:var(--gold2);color:#2A201C}
.note{font-size:14px;color:var(--note)}
.ok{color:var(--okc);font-weight:600}
.arab{font-size:30px;direction:rtl;text-align:center;margin:4px 0;color:var(--gold);font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif}
.word{display:flex;align-items:center;gap:10px;border:2px dashed var(--gold2);border-radius:8px;padding:6px 10px;margin:6px 0}
.word .ar{font-size:24px;direction:rtl;color:var(--gold);font-family:"Amiri","Noto Naskh Arabic",serif;min-width:70px;text-align:center}
.cmp{display:flex;gap:8px;margin:6px 0}.cmp div{flex:1;border:2px solid var(--line);border-radius:8px;padding:8px;font-size:14px;text-align:center}
.cmp b{display:block;font-size:20px}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold2);color:#2A201C;font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9;max-width:90%;text-align:center;animation:f .25s}
pre{white-space:pre-wrap;font-size:12px;background:var(--now);padding:8px;border-radius:8px;max-height:300px;overflow:auto}
@media (max-height:740px){#hud{margin-bottom:4px}#txt{padding:10px 12px}}
@keyframes fb{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
#txt.an>*{animation:fb .32s backwards}#txt.an>*:nth-child(2){animation-delay:.1s}#txt.an>*:nth-child(3){animation-delay:.2s}#txt.an>*:nth-child(4){animation-delay:.28s}#txt.an>*:nth-child(n+5){animation-delay:.34s}
#btns.an .btn{animation:fb .3s backwards}#btns.an .btn:nth-child(1){animation-delay:.12s}#btns.an .btn:nth-child(2){animation-delay:.18s}#btns.an .btn:nth-child(3){animation-delay:.24s}#btns.an .btn:nth-child(n+4){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){#txt.an>*,#btns.an .btn{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="nav"><button id="nb" type="button">← Назад</button><button id="nm" type="button">Меню игры</button><button id="nv" type="button" aria-label="Озвучка">🔊</button><button id="nr" type="button">⌂ RIZQ</button></div>
  <div id="hud"></div>
  <div id="cvw"><canvas id="cv" width="320" height="180" role="img" aria-label="Картинка сцены"></canvas></div>
  <div id="ttl"></div>
  <div id="txt"></div>
  <div id="btns"></div>
</div>
<script>
(function(){
/* =========================================================
   Ильм-Крафт. Глава 1 «Честный торговец». RIZQ, 2026.
   ES5, один файл, без библиотек. Данные - только на телефоне.
   Тексты для озвучки (Marina) - в SCRIPT, ключи по сценам.
   ========================================================= */
var W=320,H=180,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var $=function(i){return document.getElementById(i)};
var KEY='rizq_igra_v1',LIM=1200;
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S=null,bg='mecca',cast=[],T=0,lim=false,scl=null,playing=false,camelOn=false;

/* ---------- сценарий (для озвучки Marina) ---------- */
/* {ж|м} - форма для девочки и мальчика, $1 $2 - подстановки */
var SCRIPT={
'title.1':'Ты впервые идёшь с караваном из Мекки в Шам. Купи товар, переживи дорогу, сохрани доверие людей - и построй свой город.',
'title.2':'В игре нет изображений Пророка (саллаллаху алейхи ва саллям) и сподвижников. О них мы рассказываем словами и только то, что передано в достоверных источниках.',
'intro.now':'Мекка, за несколько лет до начала откровения. Тебе 13 лет. Караван идёт в Шам. <span class="note">Шам - так тогда называли земли нынешних Сирии, Иордании, Палестины и Ливана.</span>',
'intro.1':'Я иду с вами и присматриваю за тобой. Вот 100 монет. Купи то, что в Шаме дороже. Твой верблюд %c унесёт 6 тюков.',
'intro.2':'Вернёшься с прибылью - доверю тебе свой тюк в следующем караване.',
'elder.0':'Старый купец чинит ремень седла и поднимает глаза.',
'elder.1':'Знаешь, кого в Мекке зовут аль-Амин? Того, кому можно доверить. Он не лжёт и не обманывает.',
'elder.2':'Почтенная Хадиджа (да будет доволен ею Аллах) узнала о правдивости и честности аль-Амина и доверила ему свой товар для торговли в Шаме. Торговля - это не только цена. Это слово, которому верят.',
'elder.now':'Аль-Амин - это Мухаммад (саллаллаху алейхи ва саллям), будущий Пророк. Так его звали в его народе ещё до пророчества (сира Ибн Хишама). Даже Абу Суфьян, в то время ещё противник Пророка (саллаллаху алейхи ва саллям), признал перед царём Ираклием: до того как Пророк (саллаллаху алейхи ва саллям) начал призыв, его ни разу не обвиняли во лжи (аль-Бухари 7). Позже Абу Суфьян (да будет доволен им Аллах) принял ислам.',
'elder.a':'Хорошее желание. Начни с малого: держи слово даже в мелочах. И вот совет: в Шаме в этом году хорошо берут $1.',
'elder.b':'Выгодна. Сегодня, завтра - может, и нет. А через год - только она. Ты {сама|сам} увидишь в пути. А пока совет: в Шаме в этом году хорошо берут $1.',
'road.1':'Караван выходит из Мекки на рассвете. Верблюды идут ровно, песок скрипит. Дядя Салим едет впереди.',
'str.1':'В полдень у дороги сидит путник в зелёном платке с жёлтой каймой. Бурдюк у него пустой. Он просит воды.',
'str.give':'Он пьёт, благодарит и уходит к соседнему каравану. Ты {запомнила|запомнил} его платок.',
'str.no':'Ты идёшь дальше. Путник смотрит вслед и ничего не говорит.',
'storm.1':'Ветер несёт песок стеной. Песок сечёт ткань и забивается во все тюки. Благовониям в закрытых флаконах буря не страшна.',
'storm.wait':'Караван встаёт кругом, ты накрываешь тюки. Буря уходит только к вечеру. Товар цел, но воды ушло много.',
'storm.lost':'Песок изрезал один рулон ткани - его уже не продать.',
'storm.ok':'Тебе повезло: товар уцелел.',
'camp.1':'Вечер. Погонщики смывают пыль, дядя Салим проверяет верёвки. Ужин у костра делят на всех.',
'wudu.now1':'Откровение ещё не началось, и намаза, которому научит Пророк (саллаллаху алейхи ва саллям), люди ещё не знали. Пройдут годы, и Аллах научит верующих омовению и молитве.',
'wudu.now2':'А ты знаешь обязательные действия омовения? Собери их по порядку.',
'wudu.done':'По шафиитскому мазхабу обязательно (фард): намерение вместе с началом омовения лица, лицо, руки вместе с локтями, протереть хотя бы часть головы, ноги вместе со щиколотками - и именно в этом порядке. Желательно (сунна): в начале сказать «Бисмиллях», вымыть кисти, прополоскать рот и промыть нос, а после головы протереть уши. В других мазхабах есть отличия - спроси у имама.',
'oasis.1':'Оазис. Пальмы, колодец, торговцы водой. Караван отдыхает до полудня.',
'oasis.low':'Воды мало. Без воды караван пойдёт медленнее, и ты устанешь.',
'def.1':'У колодца к тебе подходит покупатель. Он хочет купить $1 и готов заплатить сразу полную цену - $2.',
'def.dates':'В одном мешке фиников сверху хорошие, а внутри - с червоточиной.',
'def.cloth':'На одном рулоне ткани есть дырочка от моли. Снаружи её не видно.',
'def.oil':'Один флакон благовоний треснул, в нём осталась половина. Покупатель этого не заметил.',
'def.honest':'Ты {первая|первый}, кто сказал сам. В следующий раз беру только у тебя.',
'def.ask':'Честному - честная цена. Возьму, но дам чуть меньше. И запомню тебя.',
'def.hide1':'Он платит и уходит. Монеты в руке, а на душе неспокойно.',
'def.hide2':'Скоро в караване шепчутся: «Это {у неё|у него} товар с изъяном?»',
'def.now':'Однажды Пророк (саллаллаху алейхи ва саллям) проходил мимо кучи зерна и опустил в неё руку. Пальцы стали влажными. Хозяин сказал: «Её намочил дождь». Пророк (саллаллаху алейхи ва саллям) ответил: «Почему же ты не положил подмокшее сверху, чтобы люди видели? Кто обманывает, тот не от меня» (Муслим 102, перевод смысла). Учёные объясняют: «не от меня» значит «не идёт моим путём», а не «перестал быть мусульманином» (ан-Навави).',
'sham.1':'Шам. Огромный рынок - по-арабски сукъ. Здесь торгуют купцы со всего света.',
'sham.tired':'Ты очень {устала|устал}: торговаться будет трудно (-10% к цене).',
'sham.str':'Это ты {дала|дал} мне воды! Слушай: вон тот купец в красном платит фальшивыми монетами. Не продавай ему.',
'sham.strnow':'Ты не {знала|знал}, что он вернётся. Добро делают не ради ответа, а Аллах даёт ризк и оттуда, откуда не ждёшь.',
'sham.nostr':'В толпе мелькает знакомый зелёный платок. Путник смотрит на тебя и проходит мимо.',
'sham.conf':'У ряда с тканями ты видишь покупателя из оазиса.',
'sham.confnow':'Если обидел человека - верни его право и попроси прощения. Так исправляют ошибку.',
'sham.confok':'Он долго молчит, потом кивает: «Не каждый возвращается. Мир тебе».',
'wei.1':'Помоги, дитя! Отвесь покупательнице пять мер перца. Заплачу тебе 5 монет за работу. Захочешь - добавь щепотку сверху, я разрешаю.',
'wei.even':'Мера полная. Аллах говорит: «Наполняйте меру сполна, когда вы отпускаете мерой, и взвешивайте на точных весах...» (Коран 17:35).',
'wei.more':'Покупательница улыбается и зовёт подругу: «У этого ряда не обвешивают». Слух о честных весах идёт по рынку.',
'wei.morenow':'Пророк (саллаллаху алейхи ва саллям) сказал человеку, который взвешивал за плату: «Взвешивай и добавляй» (ат-Тирмизи 1305 - «хасан сахих» по оценке ат-Тирмизи; Абу Дауд 3336; перевод смысла). Добавлять можно своё или с разрешения хозяина товара.',
'wei.less':'Покупательница перевешивает на своих весах и уходит. Торговец остался без покупки, а ты - без платы.',
'wei.lessnow':'Аллах говорит: «Горе обвешивающим, которые требуют дать им сполна, когда люди отмеривают им, а когда сами мерят или взвешивают для других, то наносят им урон» (Коран 83:1-3).',
'oath.1':'Поклянись, что лучше $1 нет во всём Шаме - тогда возьму дороже.',
'oath.no':'Покупатель сам смотрит товар, кивает и платит обычную цену.',
'oath.yes':'Покупатель платит дороже. А вечером в соседнем ряду он видит товар не хуже и говорит соседям: «Этот купец клянётся легко». Монеты звенят, но радости нет.',
'oath.now':'Пророк (саллаллаху алейхи ва саллям) сказал: «Клятва помогает продать товар, но лишает его благодати» (аль-Бухари 2087; у Муслима 1606 - «...но лишает прибыли»; перевод смысла).',
'sell.fake':'Купец в красном расплатился фальшивыми монетами: пропало $1.',
'wid.1':'У выхода с рынка сидит вдова с детьми и продаёт лепёшки.',
'wid.now':'Аллах говорит: «Притчей о тех, кто расходует свое имущество на пути Аллаха, является притча о зерне, из которого выросло семь колосьев, и в каждом колосе - по сто зерен...» (Коран 2:261). А Пророк (саллаллаху алейхи ва саллям) сказал: «Садака не уменьшает имущества» (Муслим 2588, перевод смысла). Садака - любая сумма.',
'wid.thanks':'Вдова тихо благодарит. Её младший сын машет тебе вслед.',
'unc.good':'Люди на рынке говорили о тебе хорошо. Это дороже любой прибыли. В следующий караван возьмёшь мой тюк.',
'unc.mid':'Хорошее начало. В следующий караван доверю тебе свой тюк.',
'unc.low':'Монеты ты {привезла|привёз}. Но доверие людей вернуть труднее, чем заработать монету. Подумай об этом до следующего каравана.',
'name.1':'Ар-Раззак - Наделяющий пропитанием, Податель всех средств для существования. Тот, Кто даёт каждому его удел: и то, что мы видим, и то, чего не ждём.',
'name.2':'Аллах говорит: «Воистину, Аллах является Наделяющим уделом, Обладающим могуществом, Крепким» (Коран 51:58).',
'name.now':'Помнишь зелёный платок? «...Тому, кто боится Аллаха, Он создает выход из положения и наделяет его уделом оттуда, откуда он даже не предполагает...» (Коран 65:2-3).',
'name.bar':'Монеты бывают в руке, а барака - нет. Барака - это благословение, которое даёт Аллах.',
'end.hook':'Утром у твоего тюка лежит свёрток с жёлтой каймой. Внутри - табличка с незнакомыми знаками. Кто его оставил?',
'end.next':'Глава 2 - «Ночь в пещере Хира».',
'riba.1':'У ворот рынка ростовщик звенит монетами: «Дам тебе 20 монет сейчас, а в Шаме вернёшь 30. Купишь больше товара!»',
'riba.unc':'Подумай: 10 монет сверху - это твоя прибыль, которую ты отдашь ему. А если товар пропадёт в пути?',

'g3.hani.0':'Ночь. Душно, и вся семья спит на крыше. Не спит только Хани - ему уже двенадцать.',
'g3.hani.1':'Днём над ним смеялись: «Вы теперь с корзинщиками водитесь!» Хани сжимает кулаки.',
'g3.hani.2':'Завтра я им камнем! Пусть знают!',
'g3.hani.ch2':'Пришёл он не в драку, а к тебе - как тогда, в грозу.',
'g3.hani.talk':'Хани долго молчит. Потом шепчет: «Обидно». Ты рассказываешь, как {Ранья|Рами} не отвечает злом. Кулаки разжимаются.',
'g3.hani.go':'Утром отец одного мальчишки слушает молча. Потом зовёт сына: «Извинись». Хани растерянно кивает.',
'g3.hani.words':'Назавтра Хани приходит с порванным рукавом: слово за слово - и драка. Его мама долго молчит над рукавом.',
'g3.hani.work':'Утром Хани так занят весами, что про мальчишек почти забывает.',
'g3.hani.now':'Пророк (саллаллаху алейхи ва саллям) сказал: «Сильный не тот, кто побеждает других силой. Сильный - тот, кто владеет собой в гневе» (аль-Бухари 6114, Муслим 2609, перевод смысла).',
'g3.sleep':'Ты засыпаешь под звёздами. Завтра - снова рынок.',
'g3.rum.1':'Утро. Покупательница отдёргивает руку от твоих фиников: «Говорят, у тебя финики с червями».',
'g3.rum.2':'Я только предупреждаю людей!',
'g3.rum.show':'Люди перебирают финики. Ни одной червоточины. Покупательница берёт две меры: «Зря я слушала».',
'g3.rum.lie':'К обеду весь рынок шепчется о кривых весах. Покупатели не верят ни тебе, ни Джасиру и уходят в третью лавку.',
'g3.rum.ask':'Корзины у твоего входа. Сам{а|} знаешь чьи. Подумай до вечера.',
'g3.rum.wait':'Слух живёт до вечера. Покупателей вдвое меньше.',
'g3.khab.1':'Хаббаб ибн аль-Аратт (да будет доволен им Аллах) был кузнецом. Один мекканец задолжал ему и сказал: «Не отдам, пока не отречёшься от Мухаммада (саллаллаху алейхи ва саллям)». Хаббаб не отрёкся (аль-Бухари 2091, перевод смысла).',
'g3.khab.2':'Хаббаб (да будет доволен им Аллах) рассказывал: «Мы пожаловались Посланнику Аллаха (саллаллаху алейхи ва саллям) на притеснения и спросили: «Не попросишь ли для нас помощи? Не помолишься ли Аллаху за нас?»» (аль-Бухари 3612, 3852, перевод смысла).',
'g3.khab.2b':'Пророк (саллаллаху алейхи ва саллям) напомнил, что верующие до них терпели ещё более тяжкое и не оставляли веры (аль-Бухари 3612).',
'g3.khab.3':'Пророк (саллаллаху алейхи ва саллям) ответил: «...Аллах непременно завершит это дело, и всадник проедет из Саны в Хадрамаут, боясь лишь Аллаха, а за овец - разве что волка. Но вы торопитесь» (аль-Бухари 3612, 3852, перевод смысла).',
'g3.scr.1':'{Вы с дядей Салимом заходите|Ты заходишь} к писцу Халафу. Уже четыре года он учит тебя буквам.',
'g3.scr.2':'Сложи-ка слово «сабр» - терпение. Помнишь? Пишем справа налево.',
'g3.puz.1':'Нажимай буквы по порядку. Первая буква будет справа.',
'g3.puz.hint':'В Доме знаний ты уже видел{а|} первую букву: она подсвечена.',
'g3.puz.sin':'Похоже, но это син (س). «Сабр» пишут через сад (ص): это твёрдое, «толстое» с.',
'g3.puz.miss':'Не та буква. Скажи слово вслух: с-а-б-р. Звук «а» здесь отдельной буквой не пишется.',
'g3.puz.ok':'Три буквы сложились в целое слово.',
'g3.puz.ok2':'Ровно и без спешки. Так и пишут, и живут.',
'g3.scr.clue':'Вчера северный купец заверял у меня договор. Внизу поставил знак - как на твоей табличке. Он ещё у ворот, с караваном из Шама.',
'g3.scr.look':'На столе договор. В нём рядом с именем сироты написано слово «валий».',
'g3.scr.wali':'Валий - покровитель, опекун. Его пишут, когда за сироту или слабого отвечает кто-то сильный.',
'g3.wly.1':'Люди бывают покровителями друг другу. Но лучший Покровитель верующих - Аллах: всё в Его власти.',
'g3.scr.wait':'Халаф дописывает договор и кивает тебе.',
'g3.nor.1':'У ворот разгружается караван из Шама. Купец в синей чалме вертит в руках твою табличку.',
'g3.nor.2':'Прочесть не могу: это письмо дальнего севера. Но знак знаю: так метят вещь, оставленную на хранение. Хозяин за ней вернётся.',
'g3.nor.3':'Свёрток - не подарок, а чья-то амана? Кто же оставил его тебе - и почему именно тебе?',
'g3.nor.write':'Ты {записала|записал} слова купца на обороте старого договора. Буквы Халафа пригодились.',
'g3.prm.1':'Купец Джасир сам подходит к твоей лавке.',
'g3.prm.2':'Убери корзины этих от входа - возьму весь твой тюк вдвое. А нет - мои люди к тебе не придут.',
'g3.prm.3':'Ты помнишь своё слово: место у входа - {Раньи|Рами}.',
'g3.prm.keep':'Джасир пожимает плечами и уходит. Всю неделю его люди обходят твою лавку.',
'g3.prm.say':'«Я дал{а|} слово. Слово дороже тюка», - говоришь ты. Старый купец из соседнего ряда кивает. Джасир уходит молча.',
'g3.prm.broke':'Корзины {Раньи|Рами} теперь стоят в пыли за углом. Джасир платит половину: «Остальное - вечером».',
'g3.prm.now':'Аллах говорит: «...И будьте верны своим обещаниям, ибо за обещания вас призовут к ответу» (Коран 17:34).',
'g3.bakr.1':'А теперь снова о Биляле (да будет доволен им Аллах). Абу Бакр (да будет доволен им Аллах), купец из Мекки, выкупил его у хозяина и освободил (сира Ибн Хишама; аль-Бухари 3754, 3755).',
'g3.bakr.2':'Умар (да будет доволен им Аллах) говорил: «Абу Бакр (да будет доволен им Аллах) - наш господин, и он освободил нашего господина», имея в виду Биляла (да будет доволен им Аллах) (аль-Бухари 3754, перевод смысла).',
'g3.bakr.3':'Деньги могут давить на слабых, а могут освобождать их. Монета одна - дела разные.',
'g3.jas.1':'Вечер. Вы с дядей Салимом идёте домой. В переулке верблюд Джасира пугается и сбрасывает тюки. Кувшины с маслом катятся во все стороны. Джасир один пытается поднять тюк.',
'g3.jas.lift':'Втроём вы поднимаете тюк на верблюда. Джасир долго отряхивает руки. Потом глухо говорит: «Спасибо».',
'g3.jas.jars':'Ты {собрала|собрал} семь кувшинов из восьми. Джасир смотрит на тебя так, будто видит впервые.',
'g3.jas.pass':'Ты проходишь мимо. За спиной звякает разбитый кувшин.',
'g3.jas.gloat':'Прохожие оборачиваются. Джасир багровеет. Ссора стала ещё глубже.',
'g3.jas.now':'Аллах говорит: «Не равны добро и зло. Оттолкни зло тем, что лучше, и тогда тот, с кем ты враждуешь, станет для тебя словно близкий любящий родственник» (Коран 41:34).',
'g3.jas.now2':'«Но не будет это даровано никому, кроме тех, кто проявляет терпение...» (Коран 41:35). «Терпи, ибо Аллах не теряет вознаграждения творящих добро» (Коран 11:115).',
'g3.ret.kept':'К лавке подходит {Ранья|Рами} с новыми корзинами: «Мама просила передать: мы помним, кто нас не бросил».',
'g3.ret.broke':'Корзины {Раньи|Рами} теперь стоят у лавки дяди Салима. {Ранья|Рами} кивает тебе издалека и не подходит.',
'g3.ret.pay':'А вторую половину платы Джасир так и не отдал: «Сам{а|} понимаешь, рынок».',
'g3.ret.fr.say':'Те стихи больше никто не повторяет. Ты тогда сказал{а|} - и всем стало неловко.',
'g3.ret.fr.talk':'Я купил{а|} корзину у {Раньи|Рами}. Просто так. Ты был{а|} прав{а|}.',
'g3.ret.fr.join':'Видишь, никто не обиделся! А {Ранья|Рами}, кстати, теперь ходит к колодцу в другое время.',
'g3.ret.fr.left':'Ты тогда {ушла|ушёл}... Я потом тоже. Стало как-то не смешно.',
'g3.ngt.1':'Ночь. Все спят на крыше, а ты смотришь на звёзды. Помнишь, Хани когда-то спрашивал: «Кто же их столько сделал?»',
'g3.ngt.2':'Звёзд не сосчитать, а Творец у них Один. Ахад.',
'g3.ngt.now':'Слово «ахад» есть в Коране: «Скажи: «Он - Аллах Единый, Аллах Самодостаточный. Он не родил и не был рожден, и нет никого равного Ему»» (Коран 112:1-4).',
'g3.ngt.shahada':'Это свидетельство веры: нет божества, достойного поклонения, кроме Аллаха, и Мухаммад (саллаллаху алейхи ва саллям) - Его Посланник. Ты {сказала|сказал} его тихо, сердцем и словом. Так ты {стала|стал} {мусульманкой|мусульманином}.',
'g3.ngt.note':'{Героиня выросла|Герой вырос} до ислама. Ребёнок из мусульманской семьи уже мусульманин, а свидетельство веры произносит в каждом намазе.',
'g3.ngt.end':'Ты засыпаешь спокойно, хотя завтра на рынке снова будет трудно.',
'g3.mot.q':'Вспомни слугу Джасира и рассыпанные финики. Почему ты так {поступила|поступил}? Ответь честно: оценки здесь нет.',
'g3.res.spl.calm':'Слуга заплатил за финики, и ссоры не было.',
'g3.alt.spl.calm':'Резкий ответ - и ссора тянулась бы до вечера.',
'g3.res.spl.quiet':'Ты {потеряла|потерял} немного фиников, но ссоры не было.',
'g3.alt.spl.quiet':'Спокойное «собери или заплати» - и слуга, может быть, заплатил бы.',
'g3.res.spl.sharp':'Ссора тянулась до вечера, покупатели обходили лавку.',
'g3.alt.spl.sharp':'Спокойное «собери или заплати» - и всё кончилось бы за минуту.',
'g3.res.spl.rev':'Испорчены два товара, и дядя заплатил за чужие лепёшки.',
'g3.alt.spl.rev':'Спокойное требование - и слуга сам заплатил бы за финики.',
'g3.res.prm.keep':'Слово сдержано. Неделя без покупателей Джасира.',
'g3.alt.prm.keep':'Двойная цена на словах - а на деле половина платы и нарушенное слово.',
'g3.res.prm.say':'Слово сдержано, и рынок слышал почему.',
'g3.alt.prm.say':'Двойная цена на словах - а на деле половина платы и нарушенное слово.',
'g3.res.prm.broke':'Ты {получила|получил} половину обещанного, а {Ранья|Рами} {ушла|ушёл} от твоей лавки.',
'g3.alt.prm.broke':'Неделя без покупателей Джасира - но слово было бы цело.',
'g3.name.pre':'Аллах видит, как люди ошибаются и обижают друг друга, и не спешит наказывать: даёт время одуматься и исправиться.',
'g3.word.note':'Сабр - терпеть трудное. Хильм - не отвечать гневом, когда можешь ответить. Ахад - Единый.',
'g3.city.t':'Новая постройка - часы-тень. Она напоминает о суре «Аль-Аср»: в ней Аллах клянётся временем.',
'g3.end.hook':'Знак на табличке ставят на вещь, оставленную на хранение. Значит, свёрток - чья-то амана. Кто за ним придёт - и когда?',
'g3.end.next':'Глава 4 - «Хиджра».',
'g3.rest':'Лавка закрыта до завтра. Продолжим с этого же места. Иди, отдохни и помоги дома.',
'g3.par.1':'<b>Чему учит глава 3.</b> Пророк (саллаллаху алейхи ва саллям) открыто призвал людей к Аллаху (аль-Бухари 4770). Среди первых уверовавших были невольники и слабые (аль-Бухари 3660).',
'g3.par.2':'Билял (да будет доволен им Аллах) терпел притеснения и повторял: «Ахад, Ахад» - «Един, Един» (Ибн Маджа 150, хасан). Абу Бакр (да будет доволен им Аллах) выкупил и освободил его (аль-Бухари 3754, 3755).',
'g3.par.3':'Аль-Халим - Снисходительный, Кроткий: Аллах не спешит наказывать (Коран 17:44, в переводе Кулиева - «Выдержанный»). Выдержку и неторопливость любит Аллах (Муслим 18).',
'g3.par.act':'<b>Поступок недели:</b> когда задевают, сделать паузу и ответить спокойно или промолчать, но не мстить. И держать данное слово.',
'g3.par.ask':'<b>Вопрос к ужину:</b> «Когда тебе было обидно, но ты {сдержалась|сдержался}? Что помогло?» И ещё: «Что можно сделать, если в чате смеются над одноклассником?»',
'g3.par.safe':'<b>О притеснениях.</b> В игре о них говорится бережно, без сцен жестокости. Можно обсудить: при травле в жизни не мстят и не терпят молча в одиночку, а сразу говорят взрослым.<br><b>Свидетельство веры.</b> В конце главы герой игры, выросший до ислама, тихо произносит шахаду. Ребёнок из мусульманской семьи уже мусульманин, а шахаду произносит в каждом намазе, в ташаххуде (аль-Бухари 831).'
};
for(var k3 in SCRIPT3)SCRIPT[k3]=SCRIPT3[k3];

GEMS.halim={i:32,n:'Аль-Халим',ar:'الْحَلِيمُ',mean:'Снисходительный, Кроткий',pal:{a:'#5c2e0a',b:'#f0a060',c:'#fff0e0',d:'#b8662c'},
  ayah:'Аллах говорит: «Его славят семь небес, земля и те, кто на них. Нет ничего, что не прославляло бы Его хвалой, но вы не понимаете их славословия. Воистину, Он - Выдержанный, Прощающий» (Коран 17:44). «Выдержанный» здесь - это имя Аль-Халим.',
  life:'Выдержка - не слабость: сдержаться, когда можешь ответить, - это сила. «Доброе слово и прощение лучше милостыни, за которой следует обидный попрек. Аллах - Богатый, Выдержанный» (Коран 2:263).'};
GEMS.afuw={i:81,n:'Аль-Афув',ar:'الْعَفُوُّ',mean:'Прощающий, стирающий следы греха',pal:{a:'#4a4a5a',b:'#d8d8e8',c:'#ffffff',d:'#9a9ab8'},
  ayah:'Аллах говорит: «Если вы обнаружите добро, скроете его или простите злодеяние, то ведь Аллах - Снисходительный, Всемогущий» (Коран 4:149). В этом аяте словом «Снисходительный» передано имя Аль-Афув.',
  life:'Простить - не значит сказать «обижать можно». Это значит не мстить и не держать зла. О несправедливости можно сказать прямо и спокойно, а прощать учатся всю жизнь.'};
GEMS.waliyy={i:55,n:'Аль-Валий',ar:'الْوَلِيُّ',mean:'Правитель, Помогающий, Покровитель',pal:{a:'#3a4a0f',b:'#c8e070',c:'#f6ffe0',d:'#7a9a2c'},
  ayah:'Аллах говорит: «Аллах - Покровитель тех, которые уверовали. Он выводит их из мраков к свету...» (Коран 2:257). «...Он - Достохвальный Покровитель» (Коран 42:28).',
  life:'У невольника Биляла (да будет доволен им Аллах) не было защитников среди людей. Но у верующих есть Покровитель - Аллах, и помощь Он посылает через людей, как через Абу Бакра (да будет доволен им Аллах). Проси защиты у Аллаха и помогай слабым.'};

BADGES.sled3='Следопыт главы 3: найдены все тайные самоцветы';BADGES.gruz='Ровный груз: верблюд навьючен ровно с первой попытки';BADGES.bukvy='Твёрдая рука: слово «сабр» без ошибки';

var SCROLL3=[
  ['Открытый призыв','Аллах ниспослал: «Предостереги своих ближайших родственников!» (Коран 26:214). Пророк (саллаллаху алейхи ва саллям) поднялся на холм ас-Сафа и позвал мекканцев. Люди сказали: «Мы не знали за тобой ничего, кроме правды» (аль-Бухари 4770, перевод смысла).'],
  ['Первые уверовавшие','Аммар (да будет доволен им Аллах) рассказывал, что вначале с Пророком (саллаллаху алейхи ва саллям) были только пятеро невольников, две женщины и Абу Бакр (да будет доволен им Аллах) (аль-Бухари 3660).'],

function chEnd(n){

'g4.niy2':'Дальше в этом хадисе: «Чьё переселение было к Аллаху и Его Посланнику, того переселение - к Аллаху и Его Посланнику. А чьё переселение было ради мирского или ради женщины, на которой он хотел жениться, того переселение - к тому, ради чего он переселялся» (аль-Бухари 54, Муслим 1907, перевод смысла).',
'g4.abu':'Аиша (да будет доволен ею Аллах) рассказывала: её отец Абу Бакр (да будет доволен им Аллах) собрался переселиться, но Пророк (саллаллаху алейхи ва саллям) сказал ему: «Не спеши: я надеюсь, что и мне будет дано разрешение». Абу Бакр стал ждать и четыре месяца откармливал двух верблюдиц для дороги (аль-Бухари 3905, перевод смысла).',
'g4.noon':'Однажды в полуденный зной Пророк (саллаллаху алейхи ва саллям) пришёл в дом Абу Бакра (да будет доволен им Аллах) - в час, когда прежде никогда не приходил, - и сообщил: разрешение уйти получено. Абу Бакр спросил: «Вместе, о Посланник Аллаха?» Пророк (саллаллаху алейхи ва саллям) ответил: «Да» (аль-Бухари 3905, перевод смысла).',
'g4.asma':'Асма, дочь Абу Бакра (да будет доволен ими Аллах), собирала еду в дорогу. Завязать мешок и бурдюк было нечем - только её пояс. Отец сказал: разрежь его надвое. Одной половиной она завязала мешок, другой - бурдюк. С тех пор её зовут Обладательницей двух поясов (аль-Бухари 2979, 3907, перевод смысла).',
'g4.bye.0':'Последний вечер в Мекке. Караван уходит ночью и тихо: уходящих мусульман здесь отпускают неохотно.',
'g4.bye.1':'Устроим пир на всю улицу! Пусть помнят, что мы ушли красиво!',
'g4.bye.all':'Улица гудит до ночи. Теперь все знают, когда и откуда вы выйдете. Люди Джасира тоже.',
'g4.bye.close':'{Сальма|Харис} суёт тебе в руки узелок с лепёшками: «Я никому. Дойдёте - передай весточку». Хани вздыхает, но соглашается: тихо так тихо.',
'g4.bye.close2':'{Сальма|Харис} суёт тебе в руки узелок с лепёшками: «Помнишь колодец? Ты тогда был{а|} прав{а|}. Я никому. Дойдёте - передай весточку». Хани вздыхает, но соглашается: тихо так тихо.',
'g4.bye.none':'Ночью ты проходишь мимо дома {Сальмы|Хариса}. В окне темно. О твоём уходе {она|он} узнает от чужих.',
'g4.bye.now':'Тайну не раздают всем подряд и не прячут от самых близких. Нужно знать, кому, что и когда сказать.',
'g4.gate.0':'Ночь. Верблюды навьючены. До выхода - несколько минут.',
'g4.gate.knot':'Ты ещё раз обходишь поклажу. Один бурдюк подтекает: ослаб узел. Ты перевязываешь его.',
'g4.wkl.1':'Ты {сделала|сделал} всё, что было в твоих силах: проверил{а|} узлы и поклажу. А будет ли дорога лёгкой, решает Аллах. Делать своё дело, а сердцем полагаться на Аллаха - это называется таваккуль, упование.',
'g4.gate.block':'У ворот ждут люди Джасира с факелами: «Уходящие платят за выход. Восемь монет».',
'g4.gate.pay':'Монеты звенят. Ворота открываются.',
'g4.gate.round':'Караван сворачивает в сухое русло и обходит ворота по камням. Долго, зато никому не кланяясь.',
'g4.gate.quiet':'Ворота спят. Караван выходит без единого окрика.',
'g4.gate.go':'За спиной остаётся город, где ты {родилась|родился}. Ты оглядываешься один раз.',
'g4.map.0':'Путь из Мекки в Медину - больше четырёхсот километров вдоль моря, много дней пути. В игре это четыре больших перехода. С вами идут дядя Салим, Хани и семья {Раньи|Рами}. Караван ведёт проводник.',
'g4.fork.0':'К полудню - развилка. Караван ведёт Зафир, бедуин. Он не мусульманин, но на всех стоянках его знают как человека слова.',
'g4.fork.1':'Левая тропа длиннее, зато к вечеру колодец. Правая короче, да песок там зыбкий и воды нет.',
'g4.fork.2':'Да что он знает! Я слышал, справа короче на полдня. Кто со мной?',
'g4.fork.ask':'По звёздам, по ветру, по цвету песка. Тропы я знаю. А вот куда человеку идти по жизни - это не ко мне.',
'g4.hadi.1':'Проводник показывает тропу в пустыне. А прямой путь в жизни показывает Аллах.',
'g4.fork.guide':'К вечеру - колодец. Верблюды пьют, бурдюки полны.',
'g4.fork.short':'Песок по колено. Верблюды вязнут, и приходится бросить $1. К ночи вы возвращаетесь на тропу проводника - без воды и без сил. Зафир ничего не говорит.',
'g4.fork.stars':'Ты ждёшь темноты. Семь звёзд с твоей таблички встают над левой тропой. Зафир усмехается: «Грамотн{ая|ый}. Идём?» К полуночи - колодец.',
'g4.guide':'Пророк (саллаллаху алейхи ва саллям) и Абу Бакр (да будет доволен им Аллах) тоже наняли проводника. Проводник не был мусульманином, но был искусным знатоком дорог, и ему доверились: отдали обеих верблюдиц и условились встретиться через три ночи у пещеры Саур (аль-Бухари 3905, перевод смысла).',
'g4.guide2':'Имам аль-Бухари привёл этот рассказ и в «Книге найма», в главе о найме многобожника, когда в этом есть нужда или нет мусульманина (аль-Бухари 2263). Проводнику доверились за знание дороги и надёжность.',
'g4.night.0':'Второй переход позади. Караван встаёт на ночлег среди тёмных камней лавового поля.',
'g4.cold':'Ночь в пустыне ледяная. Ты дрожишь до рассвета.',
'g4.warm':'Ночь ледяная, но под одеялом тепло. Ты высыпаешься.',
'g4.cave1':'А теперь о том, как уходил из Мекки сам Пророк (саллаллаху алейхи ва саллям). Три ночи Пророк (саллаллаху алейхи ва саллям) и Абу Бакр (да будет доволен им Аллах) провели в пещере на горе Саур (аль-Бухари 3905).',
'g4.cave2':'Абдуллах, сын Абу Бакра (да будет доволен ими Аллах), ночевал у пещеры, до рассвета возвращался в Мекку, слушал, что говорят в городе, и к ночи приносил вести. А Амир ибн Фухайра (да будет доволен им Аллах), пастух Абу Бакра, по вечерам пригонял к пещере овец - так в пещере было молоко (аль-Бухари 3905, перевод смысла).',
'g4.cave3':'Преследователи подошли к самой пещере. Абу Бакр (да будет доволен им Аллах) сказал: «Если кто-нибудь из них посмотрит себе под ноги, он увидит нас». Пророк (саллаллаху алейхи ва саллям) ответил: «Что ты думаешь, Абу Бакр, о двоих, если третий с ними - Аллах?» (аль-Бухари 3653, Муслим 2381, перевод смысла). То есть Аллах с ними Своей помощью и защитой.',
'g4.cave4':'Об этом сказано в Коране: «...Он был одним из тех двоих, которые находились в пещере, и сказал своему спутнику (Абу Бакру): «Не скорби, ибо Аллах - с нами»...» (Коран 9:40).',
'g4.shr.0':'Утром у семьи {Раньи|Рами} пусто в бурдюках: ночью лопнул шов. Их малыш плачет от жажды. До колодца ещё целый переход.',
'g4.shr.give':'{Ранья|Рами} прижимает бурдюк к груди. Малыш пьёт, не отрываясь.',
'g4.shr.half':'Ты отливаешь половину своей воды. Малыш пьёт, не отрываясь. {Ранья|Рами} молча кивает тебе.',
'g4.shr.no':'{Ранья|Рами} идёт дальше по каравану. Воду им даёт проводник Зафир - из своей доли.',
'g4.lamp.yes':'Чтобы уйти от жары, караван идёт ночью. Твоя лампа освещает тропу и тебе, и соседям.',
'g4.lamp.no':'Чтобы уйти от жары, караван идёт ночью. В темноте ты оступаешься на камнях.',
'g4.rid.0':'На рассвете к каравану подскакивает всадник на взмыленном коне. Дядя Салим поит верблюдов в стороне. Всадник останавливается у вашей поклажи.',
'g4.rid.1':'Чей караван? Откуда и куда? Мусульмане среди вас есть? За вести о них в Мекке хорошо платят.',
'g4.rid.true':'Всадник оглядывает тюки. Торговцы как торговцы. Он разворачивает коня.',
'g4.rid.lie':'Всадник смотрит на клеймо мекканского рынка на твоих тюках: «Из Таифа? Врёшь - значит, есть что скрывать». Он долго рыщет по каравану и забирает «за беспокойство» пять монет.',
'g4.rid.elder':'Дядя Салим выходит вперёд: «Доброго пути, путник. Мы идём на север с товаром. Воды?» Всадник пьёт, вытирает усы и уезжает.',
'g4.rid.all':'Всадник пересчитывает людей, запоминает лица и скачет вперёд. На следующей стоянке караван уже ждут: за проход приходится отдать $1.',
'g4.road.1':'В пути встречные узнавали Абу Бакра (да будет доволен им Аллах) и спрашивали о его спутнике - Пророке (саллаллаху алейхи ва саллям): «Кто этот человек с тобой?» Абу Бакр отвечал: «Этот человек показывает мне дорогу». Люди думали о дороге в пути, а Абу Бакр говорил о пути блага (аль-Бухари 3911, перевод смысла).',
'g4.road.2':'Абу Бакр (да будет доволен им Аллах) не солгал и не выдал тайну. Доверенное слово - тоже амана. Пророк (саллаллаху алейхи ва саллям) сказал: «Если человек рассказал что-то и оглянулся, это - доверенное» (ат-Тирмизи 1959, хасан по оценке ат-Тирмизи, перевод смысла).',
'g4.road.3':'Но есть секреты, которые беречь нельзя. Если из-за секрета кому-то больно, страшно или грозит беда, о нём сразу говорят взрослым: родителям, учителю, имаму. И от родителей «правдой без лишнего» не закрываются.',
'g4.qb.last':'Четвёртый переход - последний. Впереди Куба.',
'g4.qb.0':'Чёрная застывшая лава - и вдруг за ней зелень: тысячи пальм. Это Куба, селение у самой Медины. Хани начинает считать пальмы и на сорок третьей сбивается.',
'g4.qb.host':'Вас встречают местные мусульмане: воды сколько хочешь, фиников полные блюда. Они зовут вас братьями и сёстрами по вере и ничего не просят взамен.',
'g4.qb.help':'До вечера ты вместе с хозяевами носишь воду в рощу. Руки гудят, зато здесь ты уже не {чужая|чужой}.',
'g4.qb.sleep':'Ты засыпаешь в тени пальм и спишь до самого вечера. Хозяева тебя не будят.',
'g4.qb.tired':'Ты едва держишься на ногах и уступаешь в цене.',
'g4.qb.scales':'Весы пригодились в первый же день: хозяин рощи просит взвесить урожай. Первая плата в новом городе.',
'g4.qb.cloth':'Ткань из Мекки здесь в цене: тюк уходит за час.',
'g4.qb.none':'Лавки у тебя здесь пока нет. Но руки и голова - при тебе.',
'g4.qb.took':'Свёрток с жёлтой каймой - при тебе, целый и сухой.',
'g4.qb.left':'Половина расписки Халафа - у тебя за пазухой.',
'g4.qb.left2':'Свёрток теперь у писца Халафа, но расписки у тебя нет: если хозяин придёт, доказывать будет труднее.',
'g4.qb.sign':'На двери амбара у пальмовой рощи вырезан знак. Тот самый - с твоей таблички.',
'g4.arr.1':'Мусульмане Медины каждое утро выходили к лавовому полю на краю города и ждали, пока полуденный зной не прогонял их по домам. Однажды, когда после долгого ожидания они уже разошлись по домам, с одной из башен закричали, что Пророк (саллаллаху алейхи ва саллям) приближается. Первая остановка Пророка (саллаллаху алейхи ва саллям) была в Кубе: там была основана мечеть (аль-Бухари 3906; сира Ибн Хишама).',
'g4.arr.3':'Аль-Бара (да будет доволен им Аллах) говорил: «Я не видел, чтобы жители Медины радовались чему-нибудь так, как приходу Посланника Аллаха (саллаллаху алейхи ва саллям)» (аль-Бухари 3925, перевод смысла).',
'g4.arr.4':'Позже сподвижники повели счёт лет не от начала пророчества и не от кончины Пророка (саллаллаху алейхи ва саллям), а от прихода в Медину (аль-Бухари 3934, перевод смысла). Так начался исламский календарь.',
'g4.mot.q':'Вспомни ларец Джасира. Почему ты так {поступила|поступил}? Ответь честно: оценки здесь нет.',
'g4.res.jd.full':'Ларец вернулся к хозяину целым. Джасир это запомнил.',
'g4.alt.jd.full':'Горсть монет из ларца - и весь рынок говорил бы о сломанном замке.',
'g4.res.jd.ask':'Ларец цел, а о своём ты {сказала|сказал} открыто.',
'g4.alt.jd.ask':'Горсть монет из ларца - и весь рынок говорил бы о сломанном замке.',
'g4.res.jd.cut':'Замок сломан, монеты пришлось вернуть, да ещё платить за замок. А рынок запомнил крик Джасира.',
'g4.alt.jd.cut':'Отдать ларец целым и сказать вслух о своём: и ларец цел, и о плате не забыто.',
'g4.res.rid.true':'Ты {сказала|сказал} правду и никого не выдал{а|}.',
'g4.alt.rid.true':'Ложь про Таиф - и всадник обыскал бы караван.',
'g4.res.rid.elder':'Старший ответил спокойно, и всадник уехал.',
'g4.alt.rid.elder':'Ложь про Таиф - и всадник обыскал бы караван.',
'g4.res.rid.lie':'Ложь заметили, и караван обыскали.',
'g4.alt.rid.lie':'Правда без лишнего - «мы торговцы, идём на север» - и всадник уехал бы.',
'g4.res.rid.all':'Караван ждали на стоянке: за проход пришлось платить.',
'g4.alt.rid.all':'Правда без лишнего - «мы торговцы, идём на север» - и всадник уехал бы.',
'g4.res.fake.no':'Кошель остался у тебя, и Мансур забрал его сам.',
'g4.alt.fake.no':'Отдать кошель «брату» - и девять монет пришлось бы возместить из своих.',
'g4.res.fake.gave':'Кошель ушёл чужому, девять монет пришлось отдать из своих.',
'g4.alt.fake.gave':'Попросить Мансура прийти самому - и кошель остался бы цел.',
'g4.name.pre':'Чужие вещи ты {берегла|берёг} годами. А кто бережёт тебя, твою семью, караван в пустыне и двоих в пещере?',
'g4.word.note':'Хифз - хранить, беречь. От этого корня - слово «хафиз»: так называют тех, кто хранит Коран в памяти. Хиджра - переселение. Ният - намерение.',
'g4.city.a':'Новая постройка - амбар. В нём хранят урожай и то, что доверили другие.',
'g4.end.hook':'Знак с твоей таблички вырезан на двери амбара в Кубе. Чей это амбар? И знает ли его хозяин о свёртке?',
'g4.end.next':'Глава 5 - «Город мира».',
'g4.rest':'Караван встал на ночлег. Продолжим с этого же места. Иди, отдохни и помоги дома.',
'g4.auto.skin':'Вода на исходе: ты открываешь запасной бурдюк.',
'g4.auto.food':'Силы на исходе: ты развязываешь мешок фиников.',
'g4.auto.dry':'Воды не осталось совсем. Дядя Салим делится своей - последними глотками. Идти тяжело.',
'g4.par.1':'<b>Чему учит глава 4.</b> Верность доверенному (амана): чужую вещь и чужую тайну берегут, а вещь возвращают хозяину, даже если он тебе недруг. Фон - хиджра, переселение мусульман из Мекки в Медину в 622 году: перед уходом Пророк (саллаллаху алейхи ва саллям) позаботился, чтобы людям вернули всё, что было отдано на хранение (сира Ибн Хишама).',
'g4.par.2':'Асма, дочь Абу Бакра (да будет доволен ими Аллах), по слову отца разрезала свой пояс надвое, чтобы завязать еду и воду в дорогу (аль-Бухари 2979, 3907). В пещере Саур прозвучало: «Не скорби, ибо Аллах - с нами» (Коран 9:40).',
'g4.par.3':'Аль-Хафиз - Хранитель (Коран 11:57). Доверенное возвращают хозяину (Коран 4:58).',
'g4.par.act':'<b>Поступок недели:</b> вернуть всё, что взято на время: книгу, вещь, долг. И сберечь доверенный секрет - кроме такого, от которого кому-то плохо или страшно: о нём сразу говорят взрослым.',
'g4.par.ask':'<b>Вопрос к ужину:</b> «Что тебе когда-нибудь доверяли: вещь, дело или секрет? Трудно было сберечь?»',

SC.g5bricks=function(){

  say({t:'Стройка',bg:'stroyka',cast:BRC,p:[L('g5.br.0'),L('g5.br.how'),tired?'<span class="note">'+L('g5.br.tired')+'</span>':''],b:nx('Встать в цепочку',function(){if(brKeep&&brKeep.n<8)S.br=brKeep;if(!S.br||S.br.n>=8)S.br=brKeep={n:0,ok:0,bad:0,t0:Date.now(),z:tired?0.17:0.25,lp:0.5,last:0};brRender('')})});

function brPos(){var b=S.br,sp=(2.0+b.n*0.18)*(RM?0.5:1);return 0.5+0.48*Math.sin((Date.now()-b.t0)/1000*sp)}
function brRender(msg){
  var b=S.br;
  say({t:'Цепочка кирпичей',bg:'bricks',stay:true,nohud:true,cast:[],alt:'Люди в цепочке передают кирпичи, внизу полоса с бегущей меткой',p:['Кирпич <b>'+Math.min(8,b.n+1)+' из 8</b>. Целых: '+b.ok+'. Нажимай, когда метка в зелёной полосе.',msg?'<span class="note">'+msg+'</span>':''],extra:function(bx){
    var e=document.createElement('button');e.className='btn gold';e.textContent='Передать кирпич';e.onclick=function(){brPass()};bx.appendChild(e);
  }});
}
function brPass(){
  var b=S.br;if(!b||b.n>=8)return;var now=Date.now();if(now-(b.last||0)<250)return;b.last=now;
  brKeep=b;var hit=Math.abs(brPos()-0.5)<b.z/2||(now-(b.lpt||0)<150&&Math.abs(b.lp-0.5)<b.z/2);
  b.n++;if(hit){b.ok++;sfx('pop');vib(8)}else{b.bad++;b.z=Math.min(0.4,b.z+0.03);sfx('wrong')}
  b.t0=Date.now()-Math.floor(Math.random()*1500);
  if(b.n>=8)return brDone();
  brRender(L(hit?'g5.br.hit':'g5.br.miss'));
}
function brDone(){
  var b=S.br;stat('kirpichi','целых '+b.ok+' из 8');if(b.ok===8)badge('kirpich');
  seq([{t:'Стройка',bg:'stroyka',cast:BRC,_it:'kirpich',p:[L(b.ok===8?'g5.br.end.all':'g5.br.end.some')]},{t:'Как строение',bg:'stroyka',nohud:true,cast:[],p:[{now:L('g5.br.now')}]}],function(){go('g5salam')});
}

function cg6Give(){
  var c=S.cg6,cu=c.list[c.i],need=cu.pay-cu.p*cu.q,sum=cg6Sum(),res;
  if(sum===need){c.ok++;res=L('g6.ch.ok');sfx('pop')}
  else if(sum<need){c.sh++;res='Прошлый покупатель: «Ещё '+mon(need-sum)+', пожалуйста!» Ты извиняешься и докладываешь.';sfx('wrong')}
  else{c.ov++;c.lost+=sum-need;res='Прошлый покупатель ушёл, а сдачи было '+mon(need)+': ты '+g('отдала','отдал')+' '+sum+'.';sfx('wrong')}

  if(c.i>=5)return cg6Done(res);
  cg6Render(res);

}

var SCRIPT7={
'g7.title.1':'Медина, около 626 года. Тебе 31 год. На рынке много новых людей, а с ними - новые разговоры. Одно слово может ранить, а может спасти.',
'g7.title.2':'Пророка (саллаллаху алейхи ва саллям), ангелов и сподвижников не рисуем: о них говорит Рассказчица словами Корана, хадисов и сиры. Абу Нахль, Умм Саид и другие жители города в игре придуманы. Настоящие сподвижники - только в рассказах Рассказчицы, с источником.',
'g7.recall.q':'Вспомни главу 6. Как по-арабски «прибыль»?',

'g7.intro.now':'Прошло два года. Тебе 31 год. Лавка стоит на прежнем месте, а Мунир, уже двенадцатилетний, помогает тебе на рынке.',

'g7.tg.1':'Пророк (саллаллаху алейхи ва саллям) сказал: «Мусульманин - тот, от языка и рук которого мусульмане в безопасности...» (аль-Бухари 10, перевод смысла).',
'g7.tg.2':'Пророк (саллаллаху алейхи ва саллям) сказал: «Кто верует в Аллаха и в Последний день, пусть говорит благое или молчит» (аль-Бухари 6018, Муслим 47, перевод смысла). И ещё: «Доброе слово - садака» (аль-Бухари 2989, перевод смысла).',
'g7.rm.1':'Утром торговка Наджма шепчется с покупательницами у твоей лавки. До тебя долетает: «...хранит чужой свёрток. Небось давно вскрыл{а|} и продал{а|}, что внутри».',
'g7.rm.2':'Покупательница кладёт твои финики обратно и уходит к другой лавке.',
'g7.rm.back':'К вечеру по рынку ходят уже два слуха: о тебе и о Наджме. Люди обходят обе лавки.',
'g7.rm.ask':'Наджма краснеет: «Мне Сабих сказал... Я сама не видела». Умм Саид качает головой. Наджма идёт по рядам и всем говорит, что зря повторила.',
'g7.rm.show.took':'Ты показываешь свёрток: восковая печать на узле цела. Люди переглядываются. Наджма бормочет: «Значит, мне неправду сказали».',
'g7.rm.show.khalaf':'Ты показываешь половину расписки писца Халафа: свёрток хранится в Мекке при свидетелях. Наджма бормочет: «Значит, мне неправду сказали».',
'g7.rm.show.shop':'Расписки у тебя нет. Но Умм Саид встаёт рядом: «Я знаю {её|его} с тех пор, как {она пришла|он пришёл} в Медину. Чужое {она бережёт|он бережёт} честно». Шёпот стихает.',
'g7.rm.quiet':'Ты молчишь. Неделю покупателей меньше. Потом Умм Саид сама говорит торговкам: «Не повторяйте того, чего не видели». Слух затихает.',
'g7.rm.now1':'Аллах говорит: «О те, которые уверовали! Если нечестивец принесет вам весть, то разузнайте, чтобы не поразить по незнанию невинных людей, а не то вы будете сожалеть о содеянном» (Коран 49:6).',
'g7.rm.now2':'И ещё: «...Избегайте многих предположений, ибо некоторые предположения являются грехом. Не следите друг за другом и не злословьте за спиной друг друга...» (Коран 49:12).',
'g7.st.0':'Вечером Умм Саид смеётся: «Слова - как мука: прежде чем печь хлеб, их просеивают через сито». И даёт тебе старое сито. Перед тобой восемь фраз, которые ты можешь сказать вслух. Реши для каждой: сказать, промолчать или сначала проверить.',

'g7.st.all':'Все восемь слов просеяны верно. Умм Саид довольна: «Вот это сито!»',
'g7.st.some':'Сито просеяло не всё, но главное ты {запомнила|запомнил}: доброе - сказать, обидное - оставить, слух - проверить.',
'g7.mk.1':'У колодца мальчишки дразнят Мунира: он до сих пор говорит по-меккански и тянет слова. «Эй, мекканец! Скажи ещё раз!» - и хохочут.',
'g7.mk.stop':'Ты подходишь и спокойно говоришь: «Хватит. У каждого свой говор». Мальчишки пожимают плечами и расходятся. Мунир шепчет: «Спасибо».',
'g7.mk.help':'Ты зовёшь Мунира: «Пойдём, мне нужна помощь с весами». Вечером он рассказывает, как ему обидно. Ты слушаешь и отвечаешь: «Твой говор - из Мекки. Это не стыдно».',

'g7.ng.0':'Поздний вечер. Ты возвращаешься с рынка через тёмный переулок. У дома вдовы что-то тихо постукивает.',
'g7.ng.see':'Кто-то чинит покосившуюся ограду у дома вдовы. Утром она решит, что ограда всегда так стояла. Кто это был, ты так и не {узнала|узнал}: человек ушёл, не оглядываясь.',

'g7.nr.2':'Ты ведь {та самая|тот самый}, кто хранит чужой свёрток с жёлтой каймой? На нашей стоянке человек в зелёном платке спрашивал о {девушке из Мекки, у которой|юноше из Мекки, у которого} он когда-то оставил свёрток.',

'g8.title.1':'Северная дорога, около 628 года. Тебе 33 года. Кайс ответил на письмо: он ждёт у колодцев Вади-ль-Кура.',
'g8.title.2':'Пророка (саллаллаху алейхи ва саллям), ангелов и сподвижников не рисуем: о них говорит Рассказчица словами Корана, хадисов и сиры. Караванщики, Кайс и другие жители в игре придуманы. Настоящие сподвижники - только в рассказах Рассказчицы, с источником.',

'g8.intro.now':'Прошло два года. Тебе 33. Наконец пришёл ответ с севера: «Буду ждать у колодцев Вади-ль-Кура, пока не пройдёт караван из Медины. Кайс».',

'g8.intro.b.khalaf':'Половину расписки Халафа ты кладёшь в кожаный чехол: сам свёрток по-прежнему в Мекке.',
'g8.intro.b.shop':'Расписки у тебя нет, но письмо Кайса и печать с его знаком - с тобой. Сам свёрток по-прежнему в Мекке.',
'g8.dua.1':'Садясь в путь, Пророк (саллаллаху алейхи ва саллям) трижды произносил «Аллаху акбар» и говорил: «Пречист Тот, Кто подчинил нам это, ведь мы сами на такое были неспособны. Воистину, мы вернемся к нашему Господу» (Муслим 1342, перевод смысла; слова из Корана 43:13-14 - по Кулиеву).',
'g8.dua.2':'Пророк (саллаллаху алейхи ва саллям) сказал: «Путешествие - частица мучения: не даёт как следует есть, пить и спать. Закончив своё дело, спешите домой, к семье» (аль-Бухари 1804, перевод смысла).',
'g8.pl.0':'Старший каравана Насих говорит: «В пустыне главное - правильно выстроить день. Кто идёт в полуденный зной, теряет и воду, и силы».',
'g8.pl.how':'В игре день выстроен по шафиитскому мазхабу. Расставь дела дня по местам, от рассвета до ночи: нажми дело, потом время дня.',
'g8.pl.all':'День выстроен без единой ошибки. Насих одобрительно хмыкает: «Готов{ая|ый} караванщи{ца|к}».',
'g8.pl.some':'День выстроен. Насих поправил пару мест, но ты {запомнила|запомнил}, как он устроен.',
'g8.pl.now1':'Аллах говорит: «Когда вы странствуете по земле, то на вас не будет греха, если вы укоротите некоторые из намазов, если вы опасаетесь искушения со стороны неверующих...» (Коран 4:101).',
'g8.pl.now2':'В аяте сказано о страхе перед врагами. Умар (да будет доволен им Аллах) удивился, что намаз сокращают и в безопасности, и спросил об этом Пророка (саллаллаху алейхи ва саллям). Пророк (саллаллаху алейхи ва саллям) ответил: «Это милостыня, которую Аллах оказал вам, так примите же Его милостыню» (Муслим 686, перевод смысла).',
'g8.pl.now3':'По шафиитскому мазхабу, если едешь за 80 километров и дальше (в одну сторону), зухр, аср и иша можно сократить до двух ракаатов, а зухр с асром и магриб с иша - объединить. Учёные мазхаба меряли такой путь в 48 старинных арабских миль - два дня пути каравана с поклажей; в километрах его считают немного по-разному, поэтому, если путь около 80 км, спроси у имама. Сокращать можно, как только {вышла|вышел} за последние дома своего селения. Фаджр и магриб не сокращают. Порядок и намерение при объединении - спроси у имама. В других мазхабах иначе (у ханафитов в пути не объединяют).',
'g8.dg.0':'Полдень. У высохшей лужи лежит собака. Бока впали, язык наружу: она лижет мокрый песок.',
'g8.dg.give':'Ты наливаешь воду в выемку камня. Собака пьёт долго, потом поднимает голову и смотрит на тебя.',
'g8.dg.ask':'Насих ворчит: «Общая вода - для людей и верблюдов». Но отливает немного в старую миску: «Потом отмоем её семь раз, первый раз - с землёй». Собака пьёт жадно.',
'g8.dg.no':'Ты проходишь мимо. Воды и правда мало.',
'g8.dg.safe':'В жизни к чужой собаке руками не подходят: воду оставляют в миске на расстоянии и зовут взрослых. Посуду, из которой пила собака, моют семь раз, первый раз - с землёй (Муслим 279).',
'g8.dg.now':'Пророк (саллаллаху алейхи ва саллям) рассказал о человеке, которого в пути мучила жажда. Он набрал воды в свою кожаную обувь и напоил собаку, которая от жажды лизала влажную землю. Аллах отблагодарил его и простил ему. Люди спросили: «Разве и за животных есть награда?» Пророк (саллаллаху алейхи ва саллям) ответил: «За каждое живое существо есть награда» (аль-Бухари 2363, перевод смысла).',
'g8.dg.see':'Собака бежит к камням, где пищат щенки. Ты {напоила|напоил} не одну собаку, а целую семью.',
'g8.dg.see0':'Собака плетётся к камням, где пищат щенки. Кто-то из погонщиков молча идёт к ним с бурдюком.',

'g8.ty.0':'Третий день пути. Колодец на стоянке оказался сухим. До следующего - день перехода, а воды в бурдюках осталось только на питьё.',

'g8.ty.ask':'Насих отвечает: «Коран разрешает таяммум, когда воды нет. А вода, нужная для питья, - всё равно что её нет: так учат знающие». И показывает, как.',

'g8.ty.now1':'Однажды в пути у Аиши (да будет доволен ею Аллах) потерялось ожерелье. Пророк (саллаллаху алейхи ва саллям) остановился, чтобы его искать, и люди остались вместе с Пророком (саллаллаху алейхи ва саллям) там, где не было воды, а время намаза подошло. Тогда был ниспослан аят о таяммуме (аль-Бухари 334, 4608).',

'g8.ks.2':'Меня ограбили у Мекки. Остался только этот свёрток, а за мной шли. Я оставил его у твоего тюка: у честного он целее. Потом три года болел в чужом стане. А когда поправился, стыдился вернуться в Бусру: не уберёг товар дома.',

'g8.ks.reward':'«Простите: опасности для жизни не было, я приукрасил{а|}», - говоришь ты. Кайс улыбается: «Я дарю не за опасность, а за двадцать лет честности». Ты принимаешь подарок и благодаришь.',

'g9.zn.1':'Пророк (саллаллаху алейхи ва саллям) сказал жёнам: «Быстрее всех из вас последует за мной та, у которой самые длинные руки» (Муслим 2452, перевод смысла). Первой из жён после кончины Пророка (саллаллаху алейхи ва саллям) ушла из жизни Зайнаб, дочь Джахша (да будет доволен ею Аллах): она работала своими руками и раздавала садаку.',
'g9.zn.2':'Асма, дочь Абу Бакра (да будет доволен ими Аллах), рассказывала, что сама кормила коня своего мужа аз-Зубайра (да будет доволен им Аллах), носила воду, зашивала кожаное ведро и носила на голове финиковые косточки с дальнего поля (аль-Бухари 5224).',
'g9.cn.1':'Вечером, при Умм Саид, Фаиза спрашивает: «Отдать все деньги приданого в мастерскую? Или не трогать их? Что посоветуешь?»',
'g9.cn.ask':'Ты советуешь: «Не решай одна. Спроси родню и тех, кто знает ремесло и рынок, а потом соверши истихару». Через неделю Фаиза вкладывает в мастерскую треть, а остальное сберегает. Умм Саид потом говорит соседкам: «С этим человеком можно советоваться».',
'g9.cn.all':'Ты советуешь вложить всё сразу. Фаиза покупает три станка. Заказов пока хватает на один, и два станка стоят без дела. Фаиза вздыхает: «Зря я тебя послушала».',
'g9.cn.keep':'Ты советуешь не трогать приданое. Фаиза ткёт по-прежнему на одном станке и откладывает понемногу. Дело растёт медленно, но верно.',
'g9.cn.now':'Аллах говорит о верующих, которые «...совещаются между собой о делах...» (Коран 42:38). А Пророк (саллаллаху алейхи ва саллям) учил сподвижников истихаре, как учил суре Корана: когда задумал дело - совершить два ракаата сверх обязательных и попросить Аллаха выбрать лучшее (аль-Бухари 1166). Как совершать и какие слова говорить - спроси у имама.',
'g9.sl.1':'Когда договор в Худайбии записали, Пророк (саллаллаху алейхи ва саллям) велел сподвижникам принести жертвы и обрить головы. Никто не поднялся, хотя веление прозвучало трижды: людям было горько. Пророк (саллаллаху алейхи ва саллям) рассказал об этом жене, Умм Саляме (да будет доволен ею Аллах) (аль-Бухари 2731).',
'g9.sl.q':'Как ты думаешь, что посоветовала Умм Саляма (да будет доволен ею Аллах)?',
'g9.sl.2':'Умм Саляма (да будет доволен ею Аллах) посоветовала Пророку (саллаллаху алейхи ва саллям) выйти, никому ничего не говоря, заколоть своих жертвенных животных и позвать цирюльника обрить голову. Пророк (саллаллаху алейхи ва саллям) так и сделал, и люди последовали этому примеру (аль-Бухари 2731).',
'g9.ng.0':'Поздний вечер в мастерской Фаизы. Умм Саид прядёт у очага. В нише горит глиняная лампа, станок отбрасывает длинную тень.',
'g9.ng.see':'Маленькая лампа освещает весь двор. Фаиза говорит: «Раньше я ткала до темноты. Теперь - пока горит лампа, учу соседских девочек».',
'g9.nur.1':'Аллах говорит: «Аллах - Свет небес и земли. Его свет в душе верующего подобен нише, в которой находится светильник...» (Коран 24:35).',
'g9.ks.1':'Через месяц приходит весть из Вади-ль-Кура. Погонщик передаёт слова Кайса: «Теперь я спокоен. Передайте дочери: весной приеду, если Аллах даст сил».',
'g9.ks.2':'Фаиза складывает письмо отца вчетверо и прячет у сердца.',
'g9.mot.q':'Вспомни, как ты {рассказала|рассказал} Фаизе об отце. Почему ты так {поступила|поступил}? Ответь честно: оценки здесь нет.',
'g9.res.tl.wit':'Доверенное отдано при свидетелях, правда рассказана.',
'g9.alt.tl.wit':'Приукрась ты историю - Фаиза узнала бы правду из письма и перестала бы тебе верить.',
'g9.res.tl.letter':'Ты {прочитала|прочитал} Фаизе письмо отца, и она услышала правду от него самого.',
'g9.alt.tl.letter':'Приукрась ты историю - Фаиза узнала бы правду из письма и перестала бы тебе верить.',
'g9.res.tl.hero':'Фаиза узнала из письма, что ты приукрасил{а|} историю отца.',
'g9.alt.tl.hero':'Расскажи ты правду - письмо отца не спорило бы с твоими словами.',
'g9.res.tl.conf':'Ты приукрасил{а|} историю, но сам{а|} признал{ась|ся}, и Фаиза тебе поверила.',
'g9.alt.tl.conf':'Расскажи ты правду сразу - признаваться не пришлось бы.',
'g9.res.cn.ask':'Фаиза посоветовалась и вложила в мастерскую часть денег.',
'g9.alt.cn.ask':'Посоветуй ты вложить всё сразу - станки стояли бы без дела.',
'g9.res.cn.all':'Деньги вложены разом, а два станка стоят без заказов.',
'g9.alt.cn.all':'Совет со знающими людьми и истихара - и Фаиза решила бы спокойнее и, может быть, вложила бы осторожнее.',

'g9.name.pre':'Совет Умм Салямы, знание Аиши, руки Асмы и Зайнаб, верность Хадиджи (да будет доволен ими Аллах)... Кто даёт мудрость и знает, чему где быть?',
'g9.word.note':'Хикма - мудрость. Шура - совет: важные дела решают, посоветовавшись (Коран 42:38). Амина - надёжная: так называют женщину, которой можно доверить.',

'g9.end.hook':'Пройдёт два года, и в 10 году хиджры Пророк (саллаллаху алейхи ва саллям) сам поведёт людей в хадж. Что они услышат в день Арафата?',

'g9.rest':'Мастерская закрыта до завтра. Продолжим с этого же места.',
'g9.par.1':'<b>Чему учит глава 9.</b> Сподвижницы (да будет доволен ими Аллах): Хадиджа - лучшая из женщин своего времени (аль-Бухари 3432), ей передано приветствие от её Господа (аль-Бухари 3820); знание Аиши (ат-Тирмизи 3883) и её достоинство (аль-Бухари 3770); труд Асмы (аль-Бухари 5224) и Зайнаб (Муслим 2452); мудрый совет Умм Салямы в Худайбии (аль-Бухари 2731).',
'g9.par.2':'Доверенное возвращают владельцу (Коран 4:58), а при передаче хорошо позвать свидетелей, чтобы потом не было споров: так Коран велит отдавать имущество сиротам (Коран 4:6). Перед важным решением советуются (Коран 42:38) и совершают истихару (аль-Бухари 1166).',
'g9.par.3':'Аль-Хаким - Мудрый (Коран 59:24). Тайные самоцветы: Аль-Хамид - Достохвальный (31:12) и Ан-Нур - Одаряющий светом, приводящий к истине (24:35).',
'g9.par.act':'<b>Поступок недели:</b> научить кого-то тому, что умеешь сам{а|}: младшего брата, сестру, соседа. И перед важным решением посоветоваться со взрослыми.',
'g9.par.ask':'<b>Вопрос к ужину:</b> «Кто из женщин в нашей семье чему-то научил тебя? Чему?» И ещё: «Как мы принимаем важные решения в семье?»',
'g9.par.safe':'<b>О деньгах и советах.</b> В игре герой советует, как распорядиться чужим приданым, но решает сама хозяйка. Обсудите: свои деньги дети тратят с разрешения родителей, а в чужие деньги советом не лезут без спроса.'

'g10.ar.1':'В день Арафата Пророк (саллаллаху алейхи ва саллям) обратился к людям и сказал: «Ваша кровь и ваше имущество священны для вас, как священен этот ваш день, в этом вашем месяце, в этом вашем городе...» (Муслим 1218, перевод смысла).',
'g10.ar.2':'Пророк (саллаллаху алейхи ва саллям) объявил, что риба (ростовщичество) времён невежества отменена, велел бояться Аллаха в отношении женщин и напомнил о правах жён (Муслим 1218).',
'g10.ar.3':'И сказал: «Я оставил вам то, держась чего вы никогда не собьётесь: Книгу Аллаха» (Муслим 1218, перевод смысла). А Книга Аллаха велит: «Кто повинуется Посланнику, тот повинуется Аллаху...» (Коран 4:80).',
'g10.ay.1':'В тот день, в пятницу, на Арафате был ниспослан аят: «...Сегодня Я ради вас усовершенствовал вашу религию, довел до конца Мою милость к вам и одобрил для вас в качестве религии ислам...» (Коран 5:3; аль-Бухари 45).',
'g10.ay.2':'А в день жертвоприношения Пророк (саллаллаху алейхи ва саллям) снова напомнил о святости крови, имущества и чести и велел: «Пусть присутствующий передаст отсутствующему» (аль-Бухари 67, перевод смысла).',
'g10.js.1':'В дни после жертвоприношения в Мине к тебе подходит седой человек. Ты не сразу узнаёшь его: это купец Джасир, твой давний недруг из Мекки. Он принял ислам в год, когда Мекка открылась для мусульман.',
'g10.js.2':'Я много лет обижал тебя и твою семью. Прости меня, если сможешь.',
'g10.js.r.help':'Помнишь кувшины с маслом в переулке Мекки? Ты {помогла|помог} мне, хотя я тебя обижал. Я этого не забыл.',
'g10.js.r.gloat':'Я помню, как ты смеял{ась|ся} надо мной у кувшинов. Мы оба были неправы.',
'g10.js.full':'«Прощаю, Джасир. Пусть Аллах простит и тебя, и меня», - говоришь ты. Джасир опускает голову и долго молчит, а потом улыбается впервые за все эти годы.',
'g10.js.remind':'«Прощаю. Но знай: было очень больно», - говоришь ты. Джасир кивает: «Знаю. Потому и пришёл».',
'g10.js.later':'«Мне нужно время», - отвечаешь ты. Джасир кивает и отходит. Через день {вы с мужем находите|ты сам находишь} его шатёр.',
'g10.js.now':'Аллах говорит: «...Пусть они простят и будут великодушны. Разве вы не желаете, чтобы Аллах простил вас? Аллах - Прощающий, Милосердный» (Коран 24:22). Помнишь главу 3? «Оттолкни зло тем, что лучше, и тогда тот, с кем ты враждуешь, станет для тебя словно близкий любящий родственник» (Коран 41:34).',
'g10.ks.1':'В те же дни в Мине среди паломников ты замечаешь выцветший зелёный платок с жёлтой каймой. Кайс опирается на руку Фаизы.',
'g10.ks.2':'Двадцать четыре года назад я оставил свёрток у твоего тюка. А сегодня стою в хадже рядом с дочерью. Возьми мой платок на память.',
'g10.ks.take':'Ты берёшь платок. Кайс кладёт руку на сердце. Фаиза тихо говорит: «Спасибо, что сберегли».',
'g10.ks.give':'«Пусть платок останется в вашей семье», - говоришь ты и отдаёшь его Фаизе. Кайс кивает: «Ты и тут {права|прав}».',
'g10.ks.now':'Пророк (саллаллаху алейхи ва саллям) сказал: «Кто не благодарит людей, тот не благодарит и Аллаха» (ат-Тирмизи 1954, перевод смысла, хасан сахих по оценке ат-Тирмизи; также Абу Дауд 4811).',
'g10.hm.0':'Медина. Вечер после возвращения. Самир и Лейла сидят у лампы: «Расскажи, как всё было - с самого начала!»',
'g10.lt.how':'Расскажи историю по порядку: нажимай события от самого раннего к самому позднему.',
'g10.lt.all':'Вся история рассказана по порядку. Самир восхищённо выдыхает: «Двадцать четыре года!»',
'g10.lt.some':'История рассказана. Лейла пару раз переспросила, что было раньше, - и теперь помнит всё.',
'g10.lt.ok':'Дети запомнили историю: теперь они передадут её дальше.',
'g10.dt.0':'В тот хадж Пророк (саллаллаху алейхи ва саллям) говорил: «Берите у меня ваши обряды: я не знаю, может быть, после этого хаджа я больше не совершу хаджа» (Муслим 1297, перевод смысла). Этот хадж называют прощальным (аль-Бухари 4402): после переселения Пророк (саллаллаху алейхи ва саллям) совершил только его и больше хаджа не совершал (аль-Бухари 4404).',
'g10.hy.q':'Ночью Лейла никак не уснёт и шепчет: «А Аллах... тоже спит?»',
'g10.hy.a':'Ты отвечаешь ей словами Корана, самым великим аятом (Муслим 810): «Аллах - нет божества, кроме Него, Живого, Вседержителя. Им не овладевают ни дремота, ни сон...» (Коран 2:255). Абу Хурайре (да будет доволен им Аллах) сказали: кто, ложась спать, прочитает аят аль-Курси, у того до утра будет хранитель от Аллаха, - и Пророк (саллаллаху алейхи ва саллям) подтвердил, что это правда (аль-Бухари 2311).',
'g10.hy.b':'«Нет. Аллах не спит и не устаёт: Он - Живой, Вседержитель», - говоришь ты и читаешь Лейле аят аль-Курси, как читают перед сном (аль-Бухари 2311). Лейла засыпает спокойно.',
'g10.hy.sleep':'Лейла повторяет шёпотом: «Им не овладевают ни дремота, ни сон» (Коран 2:255) - и засыпает спокойно.',
'g10.ls.q':'Самир спрашивает: «А что самое главное из всего, что ты узнал{а|}?»',
'g10.ls.a':'Ты улыбаешься: всё это одно - поклоняться Аллаху так, будто видишь Его, а если не видишь Его - помнить, что Он видит тебя (аль-Бухари 50, перевод смысла). А знание передавать дальше, как велел Пророк (саллаллаху алейхи ва саллям): «Пусть присутствующий передаст отсутствующему» (аль-Бухари 67, перевод смысла).',
'g10.ls.p0':'Как на Арафате: держаться Книги Аллаха - и не собьёшься.',
'g10.ls.p1':'Как свёрток Кайса: двадцать два года - и он дома.',
'g10.ls.p2':'Как письмо Кайса: правда дошла до Фаизы через столько лет.',
'g10.ls.p3':'Как мальчик в толпе на Арафате: добро не ждёт, пока его заметят.',
'g10.res.cr.help':'Ты {сама|сам} {нашла|нашёл} мать потерявшегося мальчика.',
'g10.alt.cr.help':'Уйди ты с группой - мальчик ещё долго звал бы маму.',
'g10.res.cr.guide':'Мальчик попал к тем, кто собирает потерявшихся, и мать его нашла.',
'g10.alt.cr.guide':'Пройди ты мимо - мальчик ещё долго звал бы маму.',
'g10.res.cr.push':'Ты {толкалась|толкался} в толпе, а быстрее так и не {пошла|пошёл}.',
'g10.alt.cr.push':'Спокойствие, как велел Пророк (саллаллаху алейхи ва саллям), - и, может быть, ты {помогла|помог} бы потерявшемуся мальчику.',
'g10.res.cr.stay':'Ты {ушла|ушёл} с группой, а мальчик ещё долго стоял у камня.',
'g10.alt.cr.stay':'Отведи ты мальчика к тем, кто собирает потерявшихся, - несколько минут, и мать нашла бы его раньше.',
'g10.res.js.full':'Старая вражда закончилась прощением от всего сердца.',
'g10.alt.js.full':'Не прости ты - старая обида так и осталась бы между вами.',
'g10.res.js.remind':'Ты {простила|простил} и честно {сказала|сказал}, как было больно.',
'g10.alt.js.remind':'Простив без упрёка, ты {закончила|закончил} бы разговор легче: Коран зовёт простить и быть великодушным (Коран 24:22). А честно сказать, что было больно, - тоже можно.',
'g10.res.js.later':'Ты {взяла|взял} время - и на следующий день {пришла|пришёл} мириться {сама|сам}.',
'g10.alt.js.later':'Скажи ты «прощаю» сразу - мир наступил бы на день раньше.',
'g10.name.pre':'Милость к потерявшемуся ребёнку, прощение старого недруга, Коран, которому научили людей... От Кого вся эта милость?',
'g10.word.note':'Хутба - проповедь, речь. Хадж - паломничество в Мекку. Рахма - милость: от этого слова имена Ар-Рахман и Ар-Рахим.',
'g10.city.q':'Последняя постройка - куттаб, школа, где дети учат буквы и Коран. Знание, которое ты {собрала|собрал} за жизнь, теперь передаётся дальше.',
'g10.fin.1':'Тебе было тринадцать, когда у твоего тюка оставили свёрток с жёлтой каймой. Тебе тридцать семь. Ты {сберегла|сберёг} доверенное двадцать два года, и оно дошло до хозяйки. Кайс стоял в хадже рядом с дочерью, старая вражда закончилась, а твои дети знают всю историю.',
'g10.fin.2':'Путь окончен, а знание идёт дальше: вспоминай имена в Сокровищнице и проходи главы иначе - другие выборы, другие истории.',
'g10.end.hook':'Путь окончен: десять глав, двадцать четыре года жизни. Свёрток вернулся к хозяйке, а знание - к твоим детям. Пророк (саллаллаху алейхи ва саллям) велел: «Пусть присутствующий передаст отсутствующему» (аль-Бухари 67, перевод смысла).',
'g10.rest':'Шатры уснули. Продолжим с этого же места.',
'g10.par.1':'<b>Чему учит глава 10.</b> Прощальный хадж 632 года. В день Арафата Пророк (саллаллаху алейхи ва саллям) напомнил о святости крови и имущества, отменил рибу времён невежества и сказал, что оставляет людям Книгу Аллаха (Муслим 1218). В пятницу на Арафате ниспослан аят о совершенстве религии (Коран 5:3; аль-Бухари 45). «Пусть присутствующий передаст отсутствующему» (аль-Бухари 67).',
'g10.par.2':'Милость Аллаха больше материнской (аль-Бухари 5999). Аллах - Живой, Вседержитель: «Им не овладевают ни дремота, ни сон» (Коран 2:255); этот аят - самый великий в Коране (Муслим 810), его читают перед сном (аль-Бухари 2311).',
'g10.par.3':'Ар-Рахман - Всемилостивый (Коран 55:1-2). Тайные самоцветы: Ар-Рахим - Милующий (33:43) и Аль-Хайй - Вечно Живой (2:255).',
'g10.par.act':'<b>Поступок недели:</b> рассказать младшим или друзьям одну историю из игры, которая запомнилась больше всего. И простить того, на кого давно обижен{а|}.',
'g10.par.ask':'<b>Вопрос к ужину:</b> «Что самое главное ты узнал{а|} за все десять глав?» И ещё: «Кому в нашей семье мы передадим это знание?»',
'g10.par.safe':'<b>О прощении.</b> Игра учит прощать раскаявшегося. Обсудите: простить - не значит позволять обижать себя снова; о том, кто обижает сейчас, говорят взрослым.'
};

  ['Прощальный хадж','В десятом году хиджры (632) Пророк (саллаллаху алейхи ва саллям) совершил хадж, и множество людей пришли, чтобы следовать за Пророком (саллаллаху алейхи ва саллям) (Муслим 1218).'],
